/* Caixinha — repaginada visual v3. URLs de imagem são relativas a este arquivo (pasta assets/ ao lado).
   Caixinha — repaginada visual. Substitui o <style> principal. Mesmas classes/ids.
   Fontes (Google): <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
   Offline: cai em system-ui / ui-monospace automaticamente.
   theme-color: #16842f (claro) · #11130e (escuro) */
:root{
  color-scheme:light;
  --bg:#f6f3ea; --surface:#fffdf7; --surface-2:#f1ede1; --border:#e3dcc9; --line:#1d1f16;
  --text:#1d1f16; --text-muted:#5e604f; --text-faint:#6f7060;
  --primary:#16842f; --primary-deep:#0e5c20; --primary-ink:#ffffff; --primary-soft:#e2f2da;
  --coin:#f6c22c; --coin-deep:#b97f08;
  --income:#117a37; --income-soft:#e1f3e3;
  --expense:#c4302b; --expense-soft:#fbe5e1;
  --warning:#9a5500; --warning-bar:#f0a21a; --warning-soft:#fcefd2;
  --hero-bg:#1d1f16; --hero-text:#fffdf7; --hero-value:#f6c22c; --hero-muted:#b9baa8;
  --screen-grad:linear-gradient(165deg,#22a744 0%,#0c4f1c 100%);
  --radius:16px; --radius-row:14px; --radius-sm:12px;
  --shadow:0 3px 0 var(--border);
  --shadow-pop:0 6px 0 var(--line);
  --font-body:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-pixel:"Pixelify Sans",ui-monospace,Menlo,monospace;
}
html.dark{
  color-scheme:dark;
  --bg:#11130e; --surface:#1a1d16; --surface-2:#23271e; --border:#33392b; --line:#000000;
  --text:#eef0e2; --text-muted:#a9ad98; --text-faint:#8f937d;
  --primary:#3cbf57; --primary-deep:#1f7a33; --primary-ink:#0b1709; --primary-soft:#1b3420;
  --income:#4ade80; --income-soft:#14301c;
  --expense:#ff7466; --expense-soft:#3b1b17;
  --warning:#f5b63b; --warning-bar:#f5b63b; --warning-soft:#392b0f;
  --hero-bg:#f6c22c; --hero-text:#1d1f16; --hero-value:#1d1f16; --hero-muted:#5a4a14;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit;}
input::placeholder,textarea::placeholder{color:var(--text-faint);opacity:1;}
button{cursor:pointer;}
h1,h2,h3,p{margin:0;}
.hidden{display:none !important;}
a{color:var(--primary);} a:hover{color:var(--primary-deep);}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}

/* ---------- Fullscreen ---------- */
#lockScreen,#loginScreen,#loadingScreen,#gateScreen{
  position:fixed;inset:0;z-index:999;padding:20px;display:flex;align-items:center;justify-content:center;
  background-color:#14892f;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),var(--screen-grad);
  background-size:24px 24px,24px 24px,100% 100%;
}
.loading-content{display:flex;flex-direction:column;align-items:center;gap:18px;}
.spinner{width:22px;height:22px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--coin);border-right-color:var(--coin);border-radius:3px;animation:spin 1s steps(8) infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.lock-card{position:relative;background:var(--surface);border:2px solid #1d1f16;border-radius:22px;padding:28px 24px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 6px 0 #1d1f16;}
.lock-card .emoji{width:64px;height:64px;margin:0 auto;border-radius:16px;background:var(--coin);border:2px solid #1d1f16;box-shadow:0 3px 0 #1d1f16;display:flex;align-items:center;justify-content:center;font-size:30px;}
.lock-card h2{margin:16px 0 4px;font-family:var(--font-pixel);font-weight:600;font-size:1.5rem;}
.lock-card p{color:var(--text-muted);font-size:.9rem;line-height:1.45;margin-bottom:20px;}
#lockInput{width:100%;text-align:center;letter-spacing:14px;font-weight:800;font-size:1.6rem;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:12px;}
#lockInput:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
#lockError{color:var(--expense);font-weight:600;font-size:.85rem;min-height:18px;margin-bottom:10px;}

/* ---------- Botões ---------- */
.btn{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 16px;font-weight:700;background:var(--surface-2);color:var(--text);box-shadow:0 3px 0 var(--border);transition:transform .06s,box-shadow .06s;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border);}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;box-shadow:0 3px 0 var(--primary-deep);font-weight:800;}
.btn-primary:active{box-shadow:0 1px 0 var(--primary-deep);}
.btn-block{width:100%;}
.btn-danger{background:var(--expense-soft);color:var(--expense);border-color:transparent;box-shadow:none;font-weight:800;}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent;box-shadow:none;}
.btn-sm{padding:8px 13px;font-size:.84rem;border-radius:10px;}
.btn-coin{background:var(--coin);color:#1d1f16;border-color:transparent;box-shadow:0 3px 0 var(--coin-deep);font-weight:800;} /* novo, opcional (💸 Pagar fatura) */

/* ---------- Shell ---------- */
#app{max-width:1080px;margin:0 auto;padding:0 20px;}
.topbar{background:var(--bg);padding:18px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;}
.topbar .brand .dot{width:8px;height:8px;background:var(--primary);}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);box-shadow:0 3px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:700;}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border);}

nav.tabs{display:flex;gap:4px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:5px;margin-bottom:24px;overflow-x:auto;position:sticky;top:8px;z-index:55;box-shadow:var(--shadow);}
nav.tabs button{flex:1;white-space:nowrap;border:none;background:transparent;padding:10px;border-radius:11px;font-weight:700;font-size:.86rem;color:var(--text-muted);}
nav.tabs button:hover{background:var(--surface-2);color:var(--text);}
nav.tabs button.active{background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 0 var(--primary-deep);}

section.tab{display:none;}
section.tab.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);container-type:inline-size;}
.card h3{display:flex;align-items:center;gap:7px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:700;margin-bottom:10px;}
.card h3::before{content:"";width:12px;height:12px;flex:none;background:url(assets/icons/dot-shade.svg) center/100% no-repeat;background-color:var(--c,var(--coin));-webkit-mask:url(assets/icons/dot.svg) center/contain no-repeat;mask:url(assets/icons/dot.svg) center/contain no-repeat;}
.card .value{font-family:var(--font-body);font-size:1.6rem;font-size:clamp(1rem,12cqi,1.6rem);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.card .sub{font-size:.8rem;color:var(--text-muted);margin-top:4px;line-height:1.35;}
.value.income{color:var(--income);}
.value.expense{color:var(--expense);}
/* novo: primeiro card do Início */
.card.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-text);border:2px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 0 var(--line);min-height:150px;}
.card.hero h3{color:var(--hero-muted);} .card.hero h3::before{background-color:var(--hero-value);}
.card.hero .value{font-size:3rem;font-size:clamp(1.4rem,10cqi,3rem);line-height:1;color:var(--hero-value);margin-top:22px;}
.card.hero .sub{color:var(--hero-muted);max-width:260px;}
/* ≥1000 px: hero 2×2 ao lado de 4 colunas; abaixo disso (tablet retrato e celular): hero em linha cheia + cards em 2 colunas */
@media(min-width:1000px){.grid:has(> .card.hero){grid-template-columns:repeat(4,minmax(0,1fr));} .card.hero{grid-column:span 2;grid-row:span 2;}}
@media(min-width:1000px){.grid:has(> .card.hero):not(:has(> .card.projetado)) > .card:last-child{grid-column:span 2;}}
@media(max-width:999px){
  .grid:has(> .card.hero){grid-template-columns:1fr 1fr;}
  .card.hero{grid-column:1/-1;}
  .grid:has(> .card.hero) > .card:last-child:nth-child(even){grid-column:1/-1;} /* sobrou um card: ocupa a linha inteira (sem buraco) */
}
@media(max-width:680px){.grid:not(:has(> .card.hero)) > .card:last-child:nth-child(odd){grid-column:1/-1;}} /* idem em Investimentos/Cartões no celular */

.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;}
.section-title h2{font-family:var(--font-pixel);font-size:1.25rem;font-weight:600;}

/* ---------- Linhas ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.row-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-row);padding:12px 14px;display:flex;align-items:center;gap:12px;}
.card .row-card{background:var(--surface-2);border-color:transparent;}
.row-card.alert{background:var(--warning-soft);border-color:var(--warning-bar);} /* novo */
.row-card.alert .row-icon{background:var(--surface);border-color:var(--warning-bar);}
.row-card.alert .t2{color:var(--warning);font-weight:600;}
.row-icon{width:42px;height:42px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.card .row-icon{background:var(--surface);}
.icon-input{width:40px;height:40px;border-radius:11px;background:var(--surface);flex:none;text-align:center;font-size:1.15rem;padding:0;border:1.5px dashed var(--border);color:var(--text);}
.icon-input:focus{border-style:solid;border-color:var(--primary);outline:none;}
.row-main{flex:1;min-width:0;}
.row-main .t1{font-weight:700;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-main .t2{font-size:.78rem;color:var(--text-muted);margin-top:3px;}
.row-value{font-weight:800;font-size:1rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
.row-value.income{color:var(--income);} .row-value.expense{color:var(--expense);}
.row-actions{display:flex;gap:2px;}
.row-actions button:not(.btn){background:none;border:none;width:34px;height:34px;border-radius:9px;font-size:.95rem;color:var(--text-faint);}
.row-actions button:not(.btn):hover{background:var(--surface-2);}

.empty-state{text-align:center;padding:36px 16px;color:var(--text-muted);background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius);font-size:.9rem;}
.empty-state .emoji{font-size:2rem;display:block;margin-bottom:8px;}

/* barra "de vida" segmentada */
.progress{height:12px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:4px;overflow:hidden;margin-top:9px;padding:1.5px;}
.progress > div{height:100%;max-width:100%;border-radius:0;background:repeating-linear-gradient(90deg,var(--primary) 0 8px,transparent 8px 10px);}
.progress.warn > div{background:repeating-linear-gradient(90deg,var(--warning-bar) 0 8px,transparent 8px 10px);}
.progress.danger > div{background:repeating-linear-gradient(90deg,var(--expense) 0 8px,transparent 8px 10px);}

.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle;}
.badge.pago{background:var(--income-soft);color:var(--income);}
.badge.pendente{background:var(--warning-soft);color:var(--warning);}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.toolbar input[type=text],.toolbar select{padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);flex:1;min-width:120px;}
.toolbar input[type=text]{flex:2;min-width:200px;}
.toolbar select{min-width:165px;}

/* ---------- Form / Modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;}
#modalRoot.hidden{display:none;}
.modal-backdrop{position:absolute;inset:0;background:rgba(17,19,14,.55);}
.modal-card{position:relative;background:var(--surface);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;border-top:2px solid var(--line);padding:26px 18px calc(26px + env(safe-area-inset-bottom));}
.modal-card::before{content:"";position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--border);}
@media(min-width:640px){#modalRoot{align-items:center;} .modal-card{border-radius:22px;border:2px solid var(--line);box-shadow:var(--shadow-pop);padding:24px 22px;} .modal-card::before{display:none;}}
.modal-card h2{font-family:var(--font-pixel);font-weight:600;font-size:1.3rem;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.76rem;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.field textarea{resize:vertical;min-height:56px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:4px;}
.seg button{flex:1;padding:9px 4px;background:transparent;border:none;border-radius:9px;font-weight:700;font-size:.84rem;color:var(--text-muted);}
.seg button.active{background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 0 var(--primary-deep);font-weight:800;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn{flex:1;} .modal-actions .btn-primary{flex:2;}
.close-x{position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:none;font-size:.95rem;color:var(--text-muted);}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none;}
.toast{display:flex;align-items:center;gap:10px;background:#1d1f16;color:#fffdf7;border:2px solid var(--coin);padding:10px 16px 10px 12px;border-radius:12px;font-size:.88rem;font-weight:700;box-shadow:0 4px 0 #000;opacity:0;transform:translateY(6px);transition:all .2s;}
.toast::before{content:"";width:12px;height:12px;flex:none;background:url(assets/icons/dot-shade.svg) center/100% no-repeat;background-color:var(--coin);-webkit-mask:url(assets/icons/dot.svg) center/contain no-repeat;mask:url(assets/icons/dot.svg) center/contain no-repeat;}
.toast.show{opacity:1;transform:none;}

/* ---------- Mobile ---------- */
.ico{display:none;}
@media(max-width:680px){
  #app{padding:0 12px;}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;margin:0;border-radius:0;border:none;border-top:1.5px solid var(--border);box-shadow:none;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--surface);}
  nav.tabs button{font-size:.7rem;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.tabs button:hover{background:transparent;}
  nav.tabs button.active{background:transparent;color:var(--primary);box-shadow:none;font-weight:800;}
  nav.tabs button .ico{display:flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:9px;font-size:1.05rem;}
  nav.tabs button.active .ico{background:var(--primary-soft);}
  .grid{grid-template-columns:1fr 1fr;gap:10px;}
  .card{padding:14px;} .card .value{font-size:1.15rem;}
  .card.hero .value{font-size:2.1rem;}
}

/* ---------- Misc ---------- */
.muted{color:var(--text-muted);}
.mt8{margin-top:8px;} .mt16{margin-top:16px;}
.two-col{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:700px){.two-col{grid-template-columns:1.3fr 1fr;}}
.chart-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.chart-wrap svg circle[fill="var(--surface)"]{fill:var(--surface);}
.legend{display:flex;flex-direction:column;gap:9px;font-size:.84rem;flex:1;min-width:150px;}
.legend .li{display:flex;align-items:center;gap:9px;}
.legend .sw{width:11px;height:11px;border-radius:0;flex:none;}
.legend .lbl{flex:1;color:var(--text-muted);}
.legend .val{font-weight:700;font-variant-numeric:tabular-nums;}
.hint{font-size:.84rem;color:var(--text-muted);margin-top:6px;line-height:1.45;}
table.simple{width:100%;border-collapse:collapse;font-size:.85rem;}
table.simple th{text-align:left;color:var(--text-muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:8px;border-bottom:1.5px solid var(--border);}
table.simple td{padding:10px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
.color-dot{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--border);}
.swatches{display:flex;flex-wrap:wrap;gap:8px;}
.swatches span{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.swatches span.sel{border-color:var(--text);box-shadow:0 2px 0 var(--text);}

/* Valores em dinheiro usam Figtree 800 (o "5" da Pixelify parece "S"). Pixelify só em títulos. */
/* Paleta sugerida para gráficos (categorias/bancos):
   #16842f verde · #ea7a1c laranja · #f6c22c moeda · #3f8ae0 azul · #8a5cf0 roxo · #e85d9a rosa
   Donut: stroke-width 18 e r=50 (ficou mais "gordinho"). */

/* ---------- Logo / marca ---------- */
.brand-lockup{display:flex;align-items:center;gap:9px;}
.brand-lockup img{width:42px;height:auto;display:block;image-rendering:pixelated;}
.brand-lockup span{font-family:var(--font-pixel);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.01em;color:var(--text);}
@media(max-width:680px){.brand-lockup img{width:32px}.brand-lockup span{font-size:23px}}
.lock-card .login-coin{position:absolute;top:-52px;left:50%;margin-left:-48px;width:96px;height:auto;image-rendering:pixelated;}
.card.hero .hero-coin{position:absolute;right:-18px;bottom:-30px;width:190px;width:min(190px,34cqi);height:auto;image-rendering:pixelated;}
.card.hero > :not(.hero-coin){position:relative;z-index:1;}
@media(max-width:999px){.card.hero .hero-coin{width:116px;right:-12px;bottom:-18px;} .card.hero .sub{max-width:58%;}}
.toolbar input.search{padding-left:34px;background:url(assets/icons/search.svg) 12px center/12px no-repeat var(--surface);}
.pin-boxes{display:flex;justify-content:center;gap:10px;margin-bottom:14px;}
.pin-boxes>span{flex:1 1 0;max-width:46px;min-width:24px;height:54px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
.pin-boxes>span.filled{border-color:var(--primary);background:var(--primary-soft);}
/* ---------- Loading: moeda girando (12 quadros) ---------- */
.loading-logo{flex:none;width:120px;height:138px;background:url(assets/moeda-girando.svg) no-repeat 0 0/1440px 138px;image-rendering:pixelated;animation:cx-coin 1.2s steps(12) infinite;}
@keyframes cx-coin{to{background-position:-1440px 0}}
@media (prefers-reduced-motion:reduce){.loading-logo{animation:none}}

/* Ícones 8-bit do sistema (assets/icons/*.svg, grade 12×12). Uso: <span class="px-ico" style="--i:url(assets/icons/lock.svg)"></span> */
.px-ico{display:inline-block;flex:none;width:24px;height:24px;background-color:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;}
.px-ico.sm{width:12px;height:12px;vertical-align:-1px;margin-right:5px}.px-ico.lg{width:36px;height:36px}

/* Marcador de tópico: bolinha 8-bit. Troque a cor por --c */
.px-dot{width:12px;height:12px;flex:none;background:url(assets/icons/dot-shade.svg) center/100% no-repeat var(--c,var(--primary));-webkit-mask:url(assets/icons/dot.svg) center/contain no-repeat;mask:url(assets/icons/dot.svg) center/contain no-repeat;}
.px-dot{--c:var(--text)} /* padrão; nas bolinhas do PIN use a cor do texto */
.spinner{display:none;} /* substituído pela moeda girando */
/* Seletor de ícones (emojis) */
.emoji-picker input[type=search]{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:10px;}
.emoji-picker input[type=search]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.emoji-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin;}
.emoji-aba{flex:none;width:40px;height:40px;border-radius:10px;border:1.5px solid transparent;background:var(--surface-2);font-size:1.2rem;line-height:1;padding:0;}
.emoji-aba.active{border-color:var(--primary);background:var(--primary-soft);}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:42vh;overflow-y:auto;padding:2px;}
.emoji-btn{height:44px;border:none;border-radius:10px;background:transparent;font-size:1.6rem;line-height:1;padding:0;}
.emoji-btn:hover,.emoji-btn:focus-visible{background:var(--surface-2);}
.emoji-vazio{grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:.9rem;padding:24px 8px;}
/* ---------- Celular / toque ---------- */
html,body{overscroll-behavior-y:contain;} /* sem "puxar para atualizar" que recarrega o app e perde formulário */
.modal-card,.emoji-grid,#lockScreen,#loginScreen,#gateScreen{overscroll-behavior:contain;}
button,.btn,.icon-btn,.seg button,nav.tabs button,.row-actions button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
@media(min-width:768px){.modal-card{max-width:560px;}}
@supports(height:1dvh){.modal-card{max-height:90dvh;}} /* vh ignora a barra do navegador no celular */
.badge{font-size:.7rem;}
/* telas cheias rolam quando não cabem (teclado aberto, paisagem) em vez de cortar o cartão */
#lockScreen,#loginScreen,#gateScreen{overflow-y:auto;align-items:flex-start;padding:64px 20px 24px;}
#lockScreen .lock-card,#loginScreen .lock-card,#gateScreen .lock-card{margin:auto;}
@media(max-width:680px),(pointer:coarse){ /* celular ou qualquer aparelho de toque: em Lançamentos tocar na linha edita */
  #lancLista .row-actions{display:none;} #lancLista .row-card{cursor:pointer;}
}
@media(pointer:coarse){
  .row-actions button:not(.btn){width:44px;height:44px;}
  .btn-sm{min-height:44px;padding:10px 14px;}
  .icon-btn,.icon-input,.close-x,.emoji-aba{width:44px;height:44px;}
  .seg button{min-height:44px;}
  .swatches span{width:36px;height:36px;}
  .input-sm{min-height:44px;}
}
@media(max-width:680px){
  .row-card{flex-wrap:wrap;}
  /* 2 ou mais ações: faixa embaixo da linha (a linha de cima fica com a largura toda) */
  .row-card .row-actions:has(> :nth-child(2)){flex:0 0 100%;flex-direction:row !important;flex-wrap:wrap;justify-content:flex-end;gap:4px;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px;}
  #seletorPerfil .btn{padding:9px 12px;font-size:.84rem;}
  body.digitando nav.tabs{display:none;} /* teclado aberto: a barra inferior não rouba espaço */
}
/* hover (mouse) */
@media(hover:hover){
  .btn:hover{border-color:var(--text-faint);}
  .btn-primary:hover{filter:brightness(1.08);border-color:transparent;}
  .btn-danger:hover{filter:brightness(.97);border-color:var(--expense);}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text);}
  .icon-btn:hover{border-color:var(--text-faint);}
  .seg button:not(.active):hover{background:var(--surface);color:var(--text);}
  .row-card:hover{border-color:var(--text-faint);}
  .emoji-aba:not(.active):hover{border-color:var(--border);}
  .swatches span:hover{transform:scale(1.12);}
}
/* Lançamentos: navegação de mês e totais do filtro */
.mes-nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
.mes-nav h2{font-family:var(--font-pixel);font-size:1.25rem;font-weight:600;}
.totais-lanc{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:baseline;padding:10px 14px;margin-bottom:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.86rem;color:var(--text-muted);}
.totais-lanc b{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);}
.totais-lanc b.income{color:var(--income);} .totais-lanc b.expense{color:var(--expense);}
.lbl-short{display:none;}
@media(max-width:680px){.lbl-long{display:none;} .lbl-short{display:inline;}}
.input-sm{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);}
.input-sm:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
/* PIN: o #lockInput continua sendo o campo real, só que invisível; as caixinhas (.pin-boxes) espelham o que foi digitado */
#lockInput.pin-real{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;padding:0;margin:0;border:0;}
.pin-boxes{cursor:text;}
.pin-boxes>span.filled .px-dot{--c:var(--text);}
.card.projetado{background:var(--primary-soft);border:1.5px dashed var(--primary);box-shadow:none;}

</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loading-content">
    <div class="loading-logo" role="img" aria-label="Carregando"></div>
    <span style="font-family:var(--font-pixel);font-weight:600;color:#fff;letter-spacing:.04em">contando moedas…</span>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">

  </div>

  <nav class="tabs">

    <button data-tab="lancamentos" onclick="switchTab('lancamentos')"><span class="ico"><span class="px-ico" style="--i:url(assets/icons/receipt.svg)"></span></span>Lançamentos</button>

<div id="modalRoot" class="hidden">
  <div class="modal-backdrop" onclick="fecharModal()"></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div id="toastRoot"></div>

<script>
/* ================= Utilidades ================= */
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}
function nowISO(){ return new Date().toISOString(); }
function isoLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; } // data LOCAL (toISOString é UTC e vira o dia seguinte à noite)
function todayStr(){ return isoLocal(new Date()); }
function fmtMoney(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function fmtMonthLabel(y,m){ const d=new Date(y,m,1); return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',''); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function addMonths(dateStr,n){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1+n,1);
  const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
  dt.setDate(Math.min(d,last));
  return isoLocal(dt);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toastRoot').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); },2400);
}
// Ícone e cor de categoria/conta são texto do usuário que volta pra tela: escapa e limita antes de renderizar (defesa em profundidade).
function iconeSeguro(s){ return escapeHtml(Array.from(String(s??'')).slice(0,6).join('')); }
function corSegura(c){ return /^#[0-9a-f]{6}$/i.test(c||'')? c : '#16842f'; }
const PALETA=['#16842f','#ea7a1c','#f6c22c','#3f8ae0','#8a5cf0','#e85d9a','#0e5c20','#b97f08','#1d1f16','#c4302b','#5e604f','#0891b2'];

/* ================= Estado / Storage ================= */
function storageKey(perfil){ return perfil==='pj' ? 'planilhaFinanceiro_v1_pj' : 'planilhaFinanceiro_v1'; }
let state=null;
let perfilAtivo='pessoal';
const estados={pessoal:null, pj:null}; // os dois perfis ficam em memória o tempo todo, sincronizando em paralelo

function categoriasDefault(){
  const desp=[['Alimentação','🍔'],['Mercado','🛒'],['Transporte','🚗'],['Moradia','🏠'],
    ['Contas & Utilidades','💡'],['Saúde','💊'],['Educação','📚'],['Lazer','🎮'],
    ['Assinaturas','📺'],['Compras','🛍️'],['Cuidados Pessoais','💇'],['Pets','🐾'],
    ['Viagem','✈️'],['Presentes & Doações','🎁'],['Taxas & Juros','🏦'],['Outros','📦']];
  const rec=[['Salário','💼'],['Freelance','💻'],['Rendimentos','📈'],['Presente Recebido','🎉'],
    ['Reembolso','↩️'],['Outros (receita)','💰']];
  let i=0; const out=[];
  desp.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'despesa',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  rec.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'receita',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  return out;
}
function categoriasDefaultPJ(){
  const desp=[['Impostos (DAS)','🧾'],['Pró-labore','💸'],['Contador','📋'],['Fornecedores','📦'],
    ['Ferramentas & Softwares','💻'],['Marketing','📣'],['Taxas Bancárias','🏦'],['Outros (PJ)','📎']];
  const rec=[['Nota Fiscal Emitida','🧾'],['Vendas & Serviços','💰'],['Outros (receita PJ)','💰']];
  let i=0; const out=[];
  desp.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'despesa',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  rec.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'receita',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  return out;
}
const CHAVES_SINCRONIZAVEIS=['contas','cartoes','categorias','transacoes','financiamentos','investimentos','recorrencias'];

function estadoInicial(){
  return {
    version:1,
    contas:[{id:uuid(),nome:'Carteira',tipo:'dinheiro',saldoInicial:0,cor:PALETA[0],ativo:true,updatedAt:nowISO()}],
    cartoes:[],
    categorias:categoriasDefault(),
    transacoes:[],
    financiamentos:[],
    investimentos:[],
    recorrencias:[],
    config:{pinHash:null,onboardingConcluido:false},
    _tombstones:{}
  };
}
function estadoInicialPJ(nomeEmpresa){
  return {
    version:1,
    empresaNome:nomeEmpresa||'',
    contas:[],
    cartoes:[],
    categorias:categoriasDefaultPJ(),
    transacoes:[],
    financiamentos:[],
    investimentos:[],
    recorrencias:[],
    config:{pinHash:null,onboardingConcluido:true},
    _tombstones:{}
  };
}
function estadoVazio(){
  return {version:1,contas:[],cartoes:[],categorias:[],transacoes:[],financiamentos:[],investimentos:[],recorrencias:[],config:{pinHash:null},_tombstones:{}};
}
function normalizarEstado(alvo){
  if(!alvo.financiamentos) alvo.financiamentos=[];
  if(!alvo.recorrencias) alvo.recorrencias=[];
  alvo.recorrencias.forEach(r=>{ if(!r.intervaloMeses) r.intervaloMeses=1; });
  if(!alvo._tombstones) alvo._tombstones={};
  alvo.cartoes.forEach(c=>{ if(!c.tipo) c.tipo='credito'; });
  if(!alvo.config) alvo.config={pinHash:null};
  if(alvo.config.onboardingConcluido===undefined){
    // usuário de antes desse recurso existir: se já tem dado de verdade, não é "primeira vez"
    alvo.config.onboardingConcluido = alvo.transacoes.length>0 || alvo.contas.length>1 || alvo.recorrencias.length>0 || alvo.cartoes.length>0;
  }
  return alvo;
}
let estadoEraNovo=false;
function carregarPerfilLocal(perfil){
  try{
    const raw=localStorage.getItem(storageKey(perfil));
    if(raw) return normalizarEstado(JSON.parse(raw));
  }catch(e){ /* segue pro fallback abaixo */ }
  return null;
}
function carregarEstado(){
  estados.pessoal=carregarPerfilLocal('pessoal');
  if(!estados.pessoal){ estados.pessoal=estadoInicial(); estadoEraNovo=true; }
  estados.pj=carregarPerfilLocal('pj'); // fica null se o usuário nunca criou perfil PJ
  perfilAtivo = (localStorage.getItem('planilhaFinanceiro_perfilAtivo')==='pj' && estados.pj) ? 'pj' : 'pessoal';
  state=estados[perfilAtivo];
}
function trocarPerfil(perfil){
  if(perfil==='pj' && !estados.pj) return;
  perfilAtivo=perfil;
  localStorage.setItem('planilhaFinanceiro_perfilAtivo',perfil);
  state=estados[perfil];
  aplicarTema();
  renderTudo();
}
function aplicarTema(){
  document.documentElement.classList.toggle('dark', !!state.config.temaEscuro);
  const m=document.getElementById('metaTema'); if(m) m.content=state.config.temaEscuro?'#11130e':'#16842f'; // barra de status do celular
}
function definirTema(escuro){
  state.config.temaEscuro=escuro; state.config.temaAtualizadoEm=nowISO();
  salvarEstado(); aplicarTema(); renderConfig();
}
// Exclusão registra um "tombstone" (marcador de excluído) em vez de só sumir do array —
// sem isso, sincronizar com outro aparelho traria o registro apagado de volta (merge só sabe unir, não apagar).
function excluirRegistro(chave,id){
  const arr=state[chave];
  const idx=arr.findIndex(r=>r.id===id);
  if(idx===-1) return;
  arr.splice(idx,1);
  if(!state._tombstones[chave]) state._tombstones[chave]=[];
  state._tombstones[chave].push({id,updatedAt:nowISO()});
}
function salvarEstado(){
  try{
    localStorage.setItem(storageKey(perfilAtivo),JSON.stringify(state));
  }catch(e){
    alert('Não foi possível salvar os dados neste navegador (armazenamento local indisponível ou cheio). Faça um backup manual pelo botão "Fazer backup" para não perder nada.');
  }
  if(typeof sincronizarComFirestore==='function') sincronizarComFirestore();
}
function tocar(obj){ obj.updatedAt=nowISO(); return obj; }

/* ================= Hash (PIN) ================= */
async function hashTexto(txt){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(const c of txt){ h=(h*31 + c.charCodeAt(0))|0; }
    return 'fallback_'+h;
  }
}

/* ================= Segurança do aparelho: PIN, bloqueio ao minimizar e validade do login =================
   Tudo em localStorage, FORA do state: o PIN é do aparelho (vale pros perfis Pessoal e PJ) e nunca vai pro Firestore nem pro backup. */
const SEG={pin:'planilhaFinanceiro_pin',pinLen:'planilhaFinanceiro_pinLen',lockMin:'planilhaFinanceiro_lockMin',loginEm:'planilhaFinanceiro_loginEm',pinVisto:'planilhaFinanceiro_pinVisto'};
const SESSAO_DIAS=30; // depois disso (contado desde o login) pede e-mail e senha de novo
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };
function pinDoAparelho(){
  let h=lsGet(SEG.pin);
  if(!h){
    // PIN antigo (era guardado por perfil): vira o PIN do aparelho uma única vez
    const perfis=[state,estados.pessoal,estados.pj].filter(s=>s&&s.config);
    const antigo=perfis.map(s=>s.config.pinHash).find(Boolean);
    if(antigo){
      lsSet(SEG.pin,antigo); h=antigo;
      perfis.forEach(s=>{ s.config.pinHash=null; });
      salvarPerfilLocal('pessoal'); if(estados.pj) salvarPerfilLocal('pj');
    }
  }
  return h||null;
}

function sessaoExpirada(){ const t=Number(lsGet(SEG.loginEm)); return !!t && Date.now()-t>SESSAO_DIAS*86400000; }
function fimDaSessao(){ const t=Number(lsGet(SEG.loginEm)); return t? new Date(t+SESSAO_DIAS*86400000) : null; }
function mostrarLogin(){

}
function verificarSessao(){
  if(window.fbUid && sessaoExpirada()){
    fbLogout(); mostrarLogin();
    document.getElementById('loginError').textContent='Sua sessão expirou. Entre novamente.';
    return true;
  }
  return false;
}

/* ================= Lock screen ================= */
let pinErros=0;
async function tentarDesbloquear(){
  const input=document.getElementById('lockInput');
  if(verificarSessao()) return;
  const hash=await hashTexto(input.value);
  if(hash===pinDoAparelho()){
    pinErros=0;
    document.getElementById('lockScreen').classList.add('hidden');
    input.value=''; desenharPinBoxes();
    document.getElementById('lockError').textContent='';
    if(!window.fbUid){ mostrarLogin(); return; } // PIN não substitui o login: sem sessão não abre o app
    document.getElementById('app').classList.remove('hidden');
    possivelmenteAbrirWizard();
  }else{
    input.value=''; desenharPinBoxes();
    if(++pinErros>=5){ // errou demais: exige e-mail e senha (como app de banco)
      pinErros=0; fbLogout(); mostrarLogin();
      document.getElementById('loginError').textContent='PIN errado 5 vezes. Entre com e-mail e senha.';
      return;
    }
    document.getElementById('lockError').textContent='PIN errado, tenta de novo';
  }
}
// só visual: espelha o tamanho do valor digitado em caixinhas com bolinha (a validação continua lendo o #lockInput)
function desenharPinBoxes(){
  const box=document.getElementById('pinBoxes'), inp=document.getElementById('lockInput'); if(!box||!inp) return;
  const n=Math.max(Number(lsGet(SEG.pinLen))||4,inp.value.length);
  box.innerHTML=Array.from({length:n},(_,i)=>i<inp.value.length?'<span class="filled"><span class="px-dot"></span></span>':'<span></span>').join('');
}
document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('lockInput');
  inp?.addEventListener('keydown',e=>{ if(e.key==='Enter') tentarDesbloquear(); });
  inp?.addEventListener('input',()=>{
    desenharPinBoxes();
    const L=Number(lsGet(SEG.pinLen)); if(L && inp.value.length===L) tentarDesbloquear(); // PIN de 4 dígitos entra sozinho no 4º
  });
  document.getElementById('lockScreen')?.addEventListener('click',()=>inp.focus());
  desenharPinBoxes();
});
function bloquearApp(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('lockInput').focus();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    // só trava com login ativo, PIN criado e a opção ligada (padrão)
    if(window.fbUid && pinDoAparelho() && bloqueioAoMinimizarAtivo()) bloquearApp();
  }else verificarSessao();
});

let abaAtual='dashboard';
function switchTab(nome){

  if(nome==='dashboard') renderDashboard();
  else if(nome==='lancamentos') renderLancamentos();
  else if(nome==='contas') renderContas();
  else if(nome==='parcelamentos') renderParcelamentos();

  else if(nome==='config') renderConfig();

  const el=document.getElementById('seletorPerfil');

function alternarPerfilComLoading(){

/* ================= Helpers de domínio ================= */
function contaById(id){ return state.contas.find(c=>c.id===id); }
function cartaoById(id){ return state.cartoes.find(c=>c.id===id); }
function categoriaById(id){ return state.categorias.find(c=>c.id===id); }
function metodosPagamento(){
  return [
    {id:'dinheiro',nome:'Dinheiro',icone:'💵'},
    {id:'debito',nome:'Débito',icone:'💳'},
    {id:'pix',nome:'Pix',icone:'⚡'},
    {id:'credito',nome:'Crédito',icone:'💳'},
    {id:'boleto',nome:'Boleto',icone:'🧾'},
    {id:'transferencia',nome:'Transferência',icone:'🔁'}
  ];
}
function metodoInfo(id){ return metodosPagamento().find(m=>m.id===id) || {nome:id,icone:'💠'}; }

function saldoConta(contaId){
  const conta=contaById(contaId); if(!conta) return 0;
  let saldo=Number(conta.saldoInicial)||0;
  const hoje=todayStr();
  state.transacoes.forEach(t=>{
    if(t.metodoPagamento==='credito') return;
    if(t.data>hoje) return;
    if(t.tipo==='receita' && t.contaId===contaId) saldo+=t.valor;
    else if(t.tipo==='despesa' && t.contaId===contaId) saldo-=t.valor;
    else if(t.tipo==='transferencia'){
      if(t.contaId===contaId) saldo-=t.valor;
      if(t.contaDestinoId===contaId) saldo+=t.valor;
    }
  });
  return saldo;
}
function saldoTotalContas(){
  return state.contas.filter(c=>c.ativo!==false).reduce((s,c)=>s+saldoConta(c.id),0);
}
function inicioCicloCartao(cartao,ref){
  ref=ref||new Date();
  const dia=cartao.diaFechamento||1;
  let d=new Date(ref.getFullYear(),ref.getMonth(),dia);
  if(ref.getDate()<dia) d=new Date(ref.getFullYear(),ref.getMonth()-1,dia);
  return d;
}
function faturaAtualCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao) return 0;
  const inicio=inicioCicloCartao(cartao);
  const fim=new Date(inicio); fim.setMonth(fim.getMonth()+1);
  const iso=isoLocal;
  return state.transacoes.filter(t=>t.metodoPagamento==='credito' && t.cartaoId===cartaoId && t.data>=iso(inicio) && t.data<iso(fim))
    .reduce((s,t)=>s+t.valor,0);
}
// Mês (YYYY-MM) em que a transação conta nos totais: compra no crédito cai na fatura que fecha
// no mês seguinte se feita a partir do dia de fechamento (fecha dia 8: 10/set e 05/out → out; 08/out → nov).
function mesCompetencia(t){
  const c=t.metodoPagamento==='credito'? cartaoById(t.cartaoId) : null;
  if(!c || c.titular || !c.diaFechamento) return t.data.slice(0,7);
  const [a,m,d]=t.data.split('-').map(Number);
  const ref=new Date(a,m-1+(d>=c.diaFechamento?1:0),1); // Date resolve a virada de dezembro
  return anoMesStr(ref.getFullYear(),ref.getMonth());
}
function rotuloMes(ym){ const [a,m]=ym.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][m-1]+'/'+a.slice(2); }
function pagamentosFaturaCartao(cartaoId){
  return state.transacoes.filter(t=>t.pagamentoFatura && t.cartaoId===cartaoId).reduce((s,t)=>s+t.valor,0);
}
function comprasCreditoCartao(cartaoId,antesDe){
  return state.transacoes.filter(t=>t.metodoPagamento==='credito' && t.cartaoId===cartaoId && (!antesDe||t.data<antesDe))
    .reduce((s,t)=>s+t.valor,0);
}
// Faturas já fechadas e ainda não pagas (compras antes do início do ciclo aberto − pagamentos).
function faturaFechadaCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao||cartao.titular) return 0;
  const iso=isoLocal(inicioCicloCartao(cartao));
  return Math.max(0, round2(comprasCreditoCartao(cartaoId,iso)-pagamentosFaturaCartao(cartaoId)));
}
function divendaTotalCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao) return 0;
  if(cartao.titular) return vocDeveNoCartao(cartaoId);
  return Math.max(0, round2(comprasCreditoCartao(cartaoId)-pagamentosFaturaCartao(cartaoId)));
}
function vocDeveNoCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao) return 0;
  const gasto=state.transacoes.filter(t=>t.cartaoId===cartaoId && t.tipo==='despesa').reduce((s,t)=>s+t.valor,0);
  return Math.max(0, round2(gasto - (cartao.pagamentosFeitos||0)));
}
function totalDividaCartoes(){
  return state.cartoes.reduce((s,c)=>s+divendaTotalCartao(c.id),0);
}
function totalInvestimentos(){
  return state.investimentos.reduce((s,i)=>s+(Number(i.valorAtual)||0),0);
}
function patrimonioLiquido(){
  return saldoTotalContas() + totalInvestimentos() - totalDividaCartoes();
}
function mesAtualRange(){
  const hoje=new Date();
  const ini=isoLocal(new Date(hoje.getFullYear(),hoje.getMonth(),1));
  const fim=isoLocal(new Date(hoje.getFullYear(),hoje.getMonth()+1,0));
  return [ini,fim];
}
function transacoesDoMes(ini,fim){
  return state.transacoes.filter(t=>t.data>=ini && t.data<=fim);
}
function pad2(n){ return String(n).padStart(2,'0'); }
function ultimoDiaDoMes(ano,mesIdx){ return new Date(ano,mesIdx+1,0).getDate(); }
function anoMesStr(ano,mesIdx){ return `${ano}-${pad2(mesIdx+1)}`; }
function rangeDoMes(ano,mesIdx){
  const ini=`${anoMesStr(ano,mesIdx)}-01`;
  const fim=`${anoMesStr(ano,mesIdx)}-${pad2(ultimoDiaDoMes(ano,mesIdx))}`;
  return [ini,fim];
}

/* ================= Recorrências (receitas/despesas fixas) ================= */
// intervaloMeses=1 é mensal (padrão); 3 = a cada 3 meses (ex: revisão); 12 = anual (ex: IPVA).
// mesInicio (YYYY-MM) é a âncora: o mês em que a repetição começa a contar.
function descricaoFrequenciaRecorrencia(r){
  const intervalo=r.intervaloMeses||1;
  if(intervalo===1) return `Todo dia ${r.diaDoMes}`;
  if(intervalo===12) return `Todo ano, dia ${r.diaDoMes}`;
  return `A cada ${intervalo} meses, dia ${r.diaDoMes}`;
}
function recorrenciaDevidaNoMes(r,ano,mesIdx){
  const intervalo=r.intervaloMeses||1;
  if(intervalo<=1) return true;
  if(!r.mesInicio) return true;
  const [ai,mi]=r.mesInicio.split('-').map(Number);
  const diff=(ano*12+mesIdx)-(ai*12+(mi-1));
  return diff>=0 && diff%intervalo===0;
}
function gerarTransacoesRecorrentesDoMes(ano,mesIdx){
  const anoMes=anoMesStr(ano,mesIdx);
  const hoje=todayStr();
  let mudou=false;
  (state.recorrencias||[]).forEach(r=>{
    if(r.ativo===false) return;
    if((r.mesesGerados||[]).includes(anoMes)) return;
    if(!recorrenciaDevidaNoMes(r,ano,mesIdx)) return;
    const dia=Math.min(r.diaDoMes||1, ultimoDiaDoMes(ano,mesIdx));
    const data=`${anoMes}-${pad2(dia)}`;
    // id determinístico: dois aparelhos que geram o mesmo mês antes de sincronizar produzem o MESMO registro (o merge dedupa por id)
    const id=`rec_${r.id}_${anoMes}`;
    const jaExiste=state.transacoes.some(t=>t.id===id) || (state._tombstones.transacoes||[]).some(t=>t.id===id);
    if(!jaExiste) state.transacoes.push(tocar({id,descricao:r.descricao,data,valor:r.valor,tipo:r.tipo,
      categoriaId:r.categoriaId,metodoPagamento:r.metodoPagamento,
      contaId:r.contaId, cartaoId:r.cartaoId,
      status:data<=hoje?'pago':'pendente',recorrenciaId:r.id,notas:''}));
    if(!r.mesesGerados) r.mesesGerados=[];
    r.mesesGerados.push(anoMes); tocar(r);
    mudou=true;
  });
  if(mudou) salvarEstado();
}
function transacoesEfetivasDoMes(ano,mesIdx){
  const anoMes=anoMesStr(ano,mesIdx);
  const reais=state.transacoes.filter(t=>mesCompetencia(t)===anoMes);
  const anoMesAtual=anoMesStr(new Date().getFullYear(),new Date().getMonth());
  if(anoMes<anoMesAtual) return reais;
  const idsComReal=new Set(reais.filter(t=>t.recorrenciaId).map(t=>t.recorrenciaId));
  const virtuais=(state.recorrencias||[]).filter(r=>r.ativo!==false && !idsComReal.has(r.id) && !(r.mesesGerados||[]).includes(anoMes) && recorrenciaDevidaNoMes(r,ano,mesIdx)).map(r=>{
    const dia=Math.min(r.diaDoMes||1, ultimoDiaDoMes(ano,mesIdx));
    const data=`${anoMes}-${pad2(dia)}`;
    return {id:'virtual_'+r.id+'_'+anoMes,descricao:r.descricao,data,valor:r.valor,tipo:r.tipo,
      categoriaId:r.categoriaId,metodoPagamento:r.metodoPagamento,contaId:r.contaId,cartaoId:r.cartaoId,
      status:'pendente',recorrenciaId:r.id,virtual:true};
  });
  return [...reais, ...virtuais];
}
function gastosPorBancoDoMes(doMes){
  const porBanco={};
  doMes.filter(t=>t.tipo==='despesa').forEach(t=>{
    const contaId = t.metodoPagamento==='credito' ? cartaoById(t.cartaoId)?.contaId : t.contaId;
    const conta = contaId ? contaById(contaId) : null;
    if(!conta) return;
    if(!porBanco[conta.nome]) porBanco[conta.nome]={valor:0,cor:conta.cor};
    porBanco[conta.nome].valor+=t.valor;
  });
  return Object.entries(porBanco).map(([nome,v])=>({nome,...v})).sort((a,b)=>b.valor-a.valor);
}

  const vencFaturas=state.cartoes.filter(c=>c.tipo==='credito' && !c.titular && c.diaVencimento).map(c=>{

    if(venc<fech){ const n=new Date(fech.getFullYear(),fech.getMonth()+1,1); venc=new Date(n.getFullYear(),n.getMonth(),diaNoMes(n.getFullYear(),n.getMonth())); }

  const nomeMesBruto=mesDash.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const nomeMes=nomeMesBruto.charAt(0).toUpperCase()+nomeMesBruto.slice(1);

  let cardProjetado='';
  if(ehMesAtual){
    const [,fimMes]=rangeDoMes(ano,mesIdx);
    const futuras=doMes.filter(t=>t.data>hoje && t.data<=fimMes && t.metodoPagamento!=='credito');
    const delta=futuras.reduce((s,t)=>s+(t.tipo==='receita'?t.valor:t.tipo==='despesa'?-t.valor:0),0);
    const projetado=saldoTotalContas()+delta;

  }

    const gasto=porCategoria[c.nome]?porCategoria[c.nome].valor:0;
    return {cat:c,gasto,pct:Math.min(100,Math.round(gasto/c.orcamentoMensal*100))};
  }).sort((a,b)=>b.pct-a.pct);

  el.innerHTML=`
    <div class="section-title" style="margin-top:0">
      <button class="icon-btn" onclick="mudarMesDash(-1)" title="Mês anterior">‹</button>
      <h2>${nomeMes}</h2>
      <button class="icon-btn" onclick="mudarMesDash(1)" title="Próximo mês">›</button>
    </div>
    ${!ehMesAtual?`<div style="text-align:center;margin:-8px 0 14px"><button class="btn btn-ghost btn-sm" onclick="irParaMesAtual()">Voltar para o mês atual</button></div>`:''}

    <div class="grid">
      <div class="card hero"><h3>Patrimônio líquido</h3><div class="value">${fmtMoney(patrimonioLiquido())}</div><div class="sub">contas + investimentos − dívida em cartões</div><img class="hero-coin" src="assets/logo-moeda.svg" alt=""></div>
      <div class="card"><h3>Saldo em contas</h3><div class="value">${fmtMoney(saldoTotalContas())}</div><div class="sub">${state.contas.length} conta(s)</div></div>
      <div class="card"><h3 style="--c:var(--income)">Receitas do mês</h3><div class="value income">${fmtMoney(receitas)}</div></div>
      <div class="card"><h3 style="--c:var(--expense)">Despesas do mês</h3><div class="value expense">${fmtMoney(despesas)}</div></div>
      ${cardProjetado}
    </div>

    ${alertasCartao.length?`<div class="section-title"><h2><span class="px-ico" style="--i:url(assets/icons/alert.svg)"></span>Atenção</h2></div>

        </div>`).join('')}</div>`:''}

    <div class="two-col mt16">
      <div class="card">
        <h3>Gastos por categoria — ${nomeMes}</h3>
        ${catArr.length? renderDonut(catArr) : '<div class="empty-state mt8"><span class="emoji"><span class="px-ico lg" style="--i:url(assets/icons/chart.svg)"></span></span>Sem despesas neste mês.</div>'}
      </div>

}
function renderDonut(catArr){
  const total=catArr.reduce((s,c)=>s+c.valor,0);
  let acc=0; const r=50,cx=60,cy=60,circ=2*Math.PI*r;
  const arcs=catArr.map(c=>{
    const frac=c.valor/total; const dash=frac*circ;
    const offset=circ-acc*circ; acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${corSegura(c.cor)}" stroke-width="18"
      stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=catArr.slice(0,8).map(c=>`<div class="li"><span class="sw" style="background:${corSegura(c.cor)}"></span><span class="lbl">${escapeHtml(c.nome)}</span><span class="val">${fmtMoney(c.valor)}</span></div>`).join('');
  return `<div class="chart-wrap mt8">
    <svg width="120" height="120" viewBox="0 0 120 120">${arcs}<circle cx="60" cy="60" r="34" fill="var(--surface)"/></svg>
    <div class="legend">${legend}</div>
  </div>`;
}

  return `<div class="grid">${cartoesCredito.map(c=>{
    const uso=divendaTotalCartao(c.id);
    if(c.titular){
      return `<div class="card">
        <h3>${escapeHtml(c.nome)}</h3>

      </div>`;
    }
    const pct=c.limite? Math.min(100,Math.round(uso/c.limite*100)):0;

    return `<div class="card">

/* ================= Lançamentos ================= */
const LANC_PAGINA=200;
let filtroLanc={q:'',tipo:'',conta:'',categoria:'',periodo:'mes',mes:todayStr().slice(0,7),limite:LANC_PAGINA};
// Lógica pura (testável em node): filtra e ordena. conta = 'c:<id>' (conta) ou 'k:<id>' (cartão).
function filtrarLancamentos(lista,f,hoje){
  const q=semAcento(f.q||'').trim();
  let ini30=null;
  if(f.periodo==='30'){ const d=new Date(hoje+'T12:00:00'); d.setDate(d.getDate()-30); ini30=isoLocal(d); }
  const r=lista.filter(t=>{
    if(f.periodo==='mes' && t.data.slice(0,7)!==f.mes) return false;
    if(ini30 && (t.data<ini30 || t.data>hoje)) return false;
    if(f.tipo && t.tipo!==f.tipo) return false;
    if(f.categoria && t.categoriaId!==f.categoria) return false;
    if(f.conta){
      const id=f.conta.slice(2);
      if(f.conta[0]==='c' ? !(t.contaId===id||t.contaDestinoId===id) : t.cartaoId!==id) return false;
    }
    if(q && !semAcento(t.descricao||'').includes(q)) return false;
    return true;
  });
  return r.sort((a,b)=>b.data.localeCompare(a.data));
}
function totaisLancamentos(lista){
  let receitas=0,despesas=0;
  lista.forEach(t=>{ if(t.tipo==='receita') receitas+=t.valor; else if(t.tipo==='despesa') despesas+=t.valor; });
  return {receitas:round2(receitas),despesas:round2(despesas),saldo:round2(receitas-despesas),n:lista.length};
}
function rotuloMesLongo(ym){
  const [a,m]=ym.split('-').map(Number);
  const s=new Date(a,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function mudarMesLanc(delta){
  const [a,m]=filtroLanc.mes.split('-').map(Number); const d=new Date(a,m-1+delta,1);
  filtroLanc.mes=anoMesStr(d.getFullYear(),d.getMonth()); filtroLanc.limite=LANC_PAGINA; renderLancamentos();
}

  el.innerHTML=`

    </div>${filtroLanc.mes!==mesAtual?'<div style="text-align:center;margin:-4px 0 12px"><button class="btn btn-ghost btn-sm" onclick="filtroLanc.mes=todayStr().slice(0,7);filtroLanc.limite=LANC_PAGINA;renderLancamentos()">Voltar para o mês atual</button></div>':''}`:''}
    <div class="toolbar">
      <input type="text" class="search" id="lancQ" placeholder="Buscar descrição..." aria-label="Buscar lançamento pela descrição" value="${escapeHtml(filtroLanc.q)}">
      <select id="lancPeriodo" aria-label="Período">

  const qEl=document.getElementById('lancQ'), tEl=document.getElementById('lancTipo'), pEl=document.getElementById('lancPeriodo'), cEl=document.getElementById('lancConta'), gEl=document.getElementById('lancCategoria');

  if(cEl.value!==filtroLanc.conta) filtroLanc.conta=''; // conta/cartão que não existe mais

  const mudou=()=>{ filtroLanc.limite=LANC_PAGINA; renderListaLancamentos(); };
  qEl.oninput=()=>{ filtroLanc.q=qEl.value; mudou(); };
  tEl.onchange=()=>{ filtroLanc.tipo=tEl.value; mudou(); };
  cEl.onchange=()=>{ filtroLanc.conta=cEl.value; mudou(); };
  gEl.onchange=()=>{ filtroLanc.categoria=gEl.value; mudou(); };
  pEl.onchange=()=>{ filtroLanc.periodo=pEl.value; filtroLanc.limite=LANC_PAGINA; renderLancamentos(); }; // mostra/esconde a navegação de mês
  renderListaLancamentos();
}

  mais.innerHTML='';
  if(!lista.length){ cont.innerHTML='<div class="empty-state"><span class="emoji"><span class="px-ico lg" style="--i:url(assets/icons/receipt.svg)"></span></span>Nenhum lançamento encontrado.</div>'; return; }
  const visiveis=lista.slice(0,filtroLanc.limite);
  cont.innerHTML=visiveis.map(t=>{
    const cat=categoriaById(t.categoriaId);
    const met=metodoInfo(t.metodoPagamento);

    const sinalCls=t.tipo==='receita'?'income':t.tipo==='despesa'?'expense':'';
    const sinal=t.tipo==='receita'?'+':t.tipo==='despesa'?'-':'';
    const st=t.data<=todayStr()?'pago':'pendente'; // calculado na hora: o campo salvo não vira "pago" sozinho
    const cartaoT=t.metodoPagamento==='credito'? cartaoById(t.cartaoId) : null;
    const fat=(cartaoT && !cartaoT.titular && cartaoT.diaFechamento)? rotuloMes(mesCompetencia(t)) : '';
    return `<div class="row-card" onclick="tocarLinhaLanc('${t.id}')">
      <div class="row-icon">${cat?iconeSeguro(cat.icone):(t.tipo==='transferencia'?'<span class="px-ico" style="--i:url(assets/icons/repeat.svg)"></span>':'<span class="px-ico" style="--i:url(assets/icons/dot.svg)"></span>')}</div>
      <div class="row-main">

        <div class="t2">${fmtDate(t.data)} · ${met.nome}${local?' · '+escapeHtml(local):''}${fat?' · fatura '+fat:''} <span class="badge ${st}">${st}</span></div>

      </div>
    </div>`;
  }).join('');
  if(lista.length>visiveis.length) mais.innerHTML=`<button class="btn btn-block mt16" onclick="filtroLanc.limite+=LANC_PAGINA;renderListaLancamentos()">Mostrar mais (restam ${lista.length-visiveis.length})</button>`;

function excluirTransacao(id){
  if(!confirm('Excluir este lançamento?')) return false;

}
// Celular/tablet de toque (<=680 px ou pointer:coarse): os ícones somem e tocar na linha abre a edição; pagamento de fatura não é editável, só excluível.
function tocarLinhaLanc(id){
  if(!matchMedia('(max-width:680px), (pointer:coarse)').matches) return;
  const t=state.transacoes.find(x=>x.id===id); if(!t) return;
  if(t.pagamentoFatura) excluirTransacao(id); else abrirFormTransacao(id);
}

      </div>
      <div class="field"><label>Método de pagamento</label>
        <select name="metodoPagamento" id="selMetodo">${metodosPagamento().map(m=>`<option value="${m.id}" ${t&&t.metodoPagamento===m.id?'selected':''}>${m.nome}</option>`).join('')}</select>
      </div>
      <div class="field" id="campoConta"><label>Conta</label>
        <select name="contaId">${state.contas.map(c=>`<option value="${c.id}" ${t&&t.contaId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field hidden" id="campoContaDestino"><label>Conta de destino</label>
        <select name="contaDestinoId">${state.contas.map(c=>`<option value="${c.id}" ${t&&t.contaDestinoId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field hidden" id="campoCartao"><label>Cartão</label>
        <select name="cartaoId">${state.cartoes.map(c=>`<option value="${c.id}" ${t&&t.cartaoId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      ${!t?`<div class="field" id="campoParcelas"><label>Parcelar em quantas vezes?</label><input type="number" min="1" max="120" name="parcelas" value="1"></div>`:''}
      <div class="field"><label>Notas (opcional)</label><textarea name="notas">${t?escapeHtml(t.notas||''):''}</textarea></div>
      <div class="modal-actions">
        ${t?`<button type="button" class="btn btn-danger" onclick="if(excluirTransacao('${t.id}')) fecharModal()">Excluir</button>`:''}
        <button type="button" class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">${t?'Salvar':'Adicionar'}</button>
      </div>
    </form>
  `;
  const form=document.getElementById('formTransacao');
  const segBtns=form.querySelectorAll('#segTipo button');
  function setTipo(v){
    segBtns.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
    document.getElementById('campoContaDestino').classList.toggle('hidden',v!=='transferencia');
    document.getElementById('campoCategoria').classList.toggle('hidden',v==='transferencia');
    const catSel=form.categoriaId;
    catSel.innerHTML=state.categorias.filter(c=>c.tipo===v).map(c=>`<option value="${c.id}">${iconeSeguro(c.icone)} ${escapeHtml(c.nome)}</option>`).join('');
  }
  segBtns.forEach(b=>b.addEventListener('click',()=>setTipo(b.dataset.v)));
  function metodoMudou(){
    const v=form.metodoPagamento.value;
    const usaCartao = v==='credito' || v==='debito';
    document.getElementById('campoCartao').classList.toggle('hidden',!usaCartao);
    document.getElementById('campoConta').classList.toggle('hidden',usaCartao);
    if(usaCartao){
      const cartoesFiltrados=state.cartoes.filter(c=>c.tipo===v);
      const label=document.querySelector('#campoCartao label');
      if(label) label.textContent = v==='credito' ? 'Cartão de crédito' : 'Cartão de débito';
      form.cartaoId.innerHTML = cartoesFiltrados.length
        ? cartoesFiltrados.map(c=>`<option value="${c.id}" ${t&&t.cartaoId===c.id?'selected':''}>${escapeHtml(c.nome)}${c.titular?` (de ${escapeHtml(c.titular)})`:''}</option>`).join('')
        : `<option value="">Nenhum cartão de ${v==='credito'?'crédito':'débito'} cadastrado</option>`;
    }
    const parc=document.getElementById('campoParcelas');
    if(parc) parc.style.display = v==='credito' ? '' : 'none';
  }
  form.metodoPagamento.addEventListener('change',metodoMudou);
  metodoMudou();
  if(!t) setTipo('despesa');

  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const tipoSel=form.querySelector('#segTipo button.active').dataset.v;
    const valor=round2(parseFloat(fd.get('valor')));
    const parcelas=Math.max(1,parseInt(fd.get('parcelas')||1));
    const metodo=fd.get('metodoPagamento');
    const usaCartao = metodo==='credito' || metodo==='debito';
    if(tipoSel==='transferencia' && fd.get('contaId') && fd.get('contaId')===fd.get('contaDestinoId')){
      alert('Escolha contas diferentes na origem e no destino da transferência.'); return;
    }
    if(usaCartao && !fd.get('cartaoId')){
      alert(`Cadastre um cartão de ${metodo==='credito'?'crédito':'débito'} em Contas antes de lançar com esse método.`);
      return;
    }
    if(!usaCartao && !state.contas.length){ alert('Cadastre uma conta em Contas antes de criar lançamentos.'); return; }
    const cartaoSelecionado = usaCartao ? cartaoById(fd.get('cartaoId')) : null;
    const base={
      descricao:fd.get('descricao').trim(),
      data:fd.get('data'),
      tipo:tipoSel,
      categoriaId: tipoSel==='transferencia'? null : fd.get('categoriaId'),
      metodoPagamento:metodo,
      contaId: metodo==='credito'? null : (metodo==='debito'? (cartaoSelecionado?cartaoSelecionado.contaId:null) : fd.get('contaId')),
      contaDestinoId: tipoSel==='transferencia'? fd.get('contaDestinoId') : null,
      cartaoId: usaCartao? fd.get('cartaoId') : null,
      notas:fd.get('notas').trim()
    };
    if(t){
      Object.assign(t,base,{valor}); tocar(t);
    }else if(fd.get('metodoPagamento')==='credito' && parcelas>1){
      const grupoId=uuid();
      const parcelaBase=round2(valor/parcelas);
      const hoje=todayStr();
      for(let i=1;i<=parcelas;i++){
        const data=addMonths(base.data,i-1);
        const v = i===parcelas ? round2(valor-parcelaBase*(parcelas-1)) : parcelaBase;
        state.transacoes.push(tocar({id:uuid(),...base,data,valor:v,
          descricao:`${base.descricao}`,
          parcelaGrupoId:grupoId,parcelaAtual:i,parcelaTotal:parcelas,
          status: data<=hoje?'pago':'pendente'}));
      }
    }else{
      state.transacoes.push(tocar({id:uuid(),...base,valor,status: base.data<=todayStr()?'pago':'pendente'}));
    }
    salvarEstado(); fecharModal(); renderTudo(); toast(t?'Lançamento atualizado.':'Lançamento adicionado.');
  });
  abrirModal();
}

// O que ainda usa uma conta/cartão/categoria (lançamentos, fixos, cartões, financiamentos). Evita deixar referência órfã.
function usosDe(tipo,id,st){
  st=st||state; const n=(arr,fn)=>(arr||[]).filter(fn).length; const u=[];
  const add=(q,um,varios)=>{ if(q) u.push(q+' '+(q===1?um:varios)); };
  if(tipo==='conta'){
    add(n(st.transacoes,t=>t.contaId===id||t.contaDestinoId===id),'lançamento','lançamentos');
    add(n(st.cartoes,c=>c.contaId===id),'cartão','cartões');
    add(n(st.recorrencias,r=>r.contaId===id),'fixo','fixos');
    add(n(st.financiamentos,f=>f.contaId===id),'financiamento','financiamentos');
  }else if(tipo==='cartao'){
    add(n(st.transacoes,t=>t.cartaoId===id),'lançamento','lançamentos');
    add(n(st.recorrencias,r=>r.cartaoId===id),'fixo','fixos');
  }else if(tipo==='categoria'){
    add(n(st.transacoes,t=>t.categoriaId===id),'lançamento','lançamentos');
    add(n(st.recorrencias,r=>r.categoriaId===id),'fixo','fixos');
  }
  return u;
}

        <div class="field"><label>Valor (R$)</label><input required type="number" step="0.01" min="0" name="valor" value="${r?r.valor:''}"></div>
        <div class="field"><label>Todo dia</label><input required type="number" min="1" max="31" name="diaDoMes" value="${r?r.diaDoMes:'5'}"></div>
      </div>
      <div class="field"><label>Repete</label>
        <div class="seg" id="segModoRec">
          <button type="button" data-v="meses" class="${(!r||r.intervaloMeses<12)?'active':''}">De X em X meses</button>
          <button type="button" data-v="ano" class="${r&&r.intervaloMeses===12?'active':''}">Todo ano</button>
        </div>
      </div>
      <div class="row2">
        <div class="field" id="campoQtdMesesRec"><label>A cada quantos meses</label>
          <input type="number" min="1" max="11" name="intervaloMesesQtd" value="${r&&r.intervaloMeses<12?r.intervaloMeses:1}">
        </div>
        <div class="field ${(!r||r.intervaloMeses===1)?'hidden':''}" id="campoMesInicioRec"><label>A partir de</label>
          <input type="month" name="mesInicio" value="${r&&r.mesInicio?r.mesInicio:anoMesStr(new Date().getFullYear(),new Date().getMonth())}">
        </div>
      </div>
      <div class="field"><label>Categoria</label>
        <select name="categoriaId">${state.categorias.filter(c=>c.tipo===tipo).map(c=>`<option value="${c.id}" ${r&&r.categoriaId===c.id?'selected':''}>${iconeSeguro(c.icone)} ${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Método de pagamento</label>
        <select name="metodoPagamento" id="selMetodoRec">${metodosPagamento().filter(m=>m.id!=='transferencia').map(m=>`<option value="${m.id}" ${r&&r.metodoPagamento===m.id?'selected':''}>${m.nome}</option>`).join('')}</select>
      </div>
      <div class="field" id="campoContaRec"><label>Conta</label>
        <select name="contaId">${state.contas.map(c=>`<option value="${c.id}" ${r&&r.contaId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field hidden" id="campoCartaoRec"><label>Cartão</label>
        <select name="cartaoId"></select>
      </div>
      <p class="hint">Editar um fixo já existente só muda os meses futuros — o lançamento deste mês (se já tiver sido gerado) você ajusta direto em Lançamentos.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">${r?'Salvar':'Adicionar'}</button>
      </div>
    </form>
  `;
  const form=document.getElementById('formRecorrencia');
  const segBtns=form.querySelectorAll('#segTipoRec button');
  function setTipo(v){
    segBtns.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
    const catSel=form.categoriaId;
    catSel.innerHTML=state.categorias.filter(c=>c.tipo===v).map(c=>`<option value="${c.id}">${iconeSeguro(c.icone)} ${escapeHtml(c.nome)}</option>`).join('');
  }
  segBtns.forEach(b=>b.addEventListener('click',()=>setTipo(b.dataset.v)));
  function metodoMudou(){
    const v=form.metodoPagamento.value;
    const usaCartao = v==='credito' || v==='debito';
    document.getElementById('campoCartaoRec').classList.toggle('hidden',!usaCartao);
    document.getElementById('campoContaRec').classList.toggle('hidden',usaCartao);
    if(usaCartao){
      const cartoesFiltrados=state.cartoes.filter(c=>c.tipo===v);
      const label=document.querySelector('#campoCartaoRec label');
      if(label) label.textContent = v==='credito' ? 'Cartão de crédito' : 'Cartão de débito';
      form.cartaoId.innerHTML = cartoesFiltrados.length
        ? cartoesFiltrados.map(c=>`<option value="${c.id}" ${r&&r.cartaoId===c.id?'selected':''}>${escapeHtml(c.nome)}${c.titular?` (de ${escapeHtml(c.titular)})`:''}</option>`).join('')
        : `<option value="">Nenhum cartão de ${v==='credito'?'crédito':'débito'} cadastrado</option>`;
    }
  }
  form.metodoPagamento.addEventListener('change',metodoMudou);
  metodoMudou();

  const segModoBtns=form.querySelectorAll('#segModoRec button');
  function atualizaCamposRepeticao(){
    const modo=form.querySelector('#segModoRec button.active').dataset.v;
    const ehAnual=modo==='ano';
    document.getElementById('campoQtdMesesRec').classList.toggle('hidden',ehAnual);
    const mensal=!ehAnual && parseInt(form.intervaloMesesQtd.value)===1;
    document.getElementById('campoMesInicioRec').classList.toggle('hidden',mensal);
  }
  segModoBtns.forEach(b=>b.addEventListener('click',()=>{
    segModoBtns.forEach(x=>x.classList.toggle('active',x===b));
    atualizaCamposRepeticao();
  }));
  form.intervaloMesesQtd.addEventListener('input',atualizaCamposRepeticao);
  atualizaCamposRepeticao();

  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const tipoSel=form.querySelector('#segTipoRec button.active').dataset.v;
    const metodo=fd.get('metodoPagamento');
    const usaCartao = metodo==='credito' || metodo==='debito';
    if(usaCartao && !fd.get('cartaoId')){
      alert(`Cadastre um cartão de ${metodo==='credito'?'crédito':'débito'} em Contas antes de criar esse fixo.`);
      return;
    }
    const cartaoSelecionado = usaCartao ? cartaoById(fd.get('cartaoId')) : null;
    const modoRepeticao=form.querySelector('#segModoRec button.active').dataset.v;
    const intervaloMeses = modoRepeticao==='ano' ? 12 : Math.min(11,Math.max(1,parseInt(fd.get('intervaloMesesQtd'))||1));
    const dados={
      descricao:fd.get('descricao').trim(),
      valor:round2(parseFloat(fd.get('valor'))),
      diaDoMes:Math.min(31,Math.max(1,parseInt(fd.get('diaDoMes')))),
      intervaloMeses,
      mesInicio: intervaloMeses>1 ? fd.get('mesInicio') : null,
      tipo:tipoSel,
      categoriaId:fd.get('categoriaId'),
      metodoPagamento:metodo,
      contaId: metodo==='credito'? null : (metodo==='debito'? (cartaoSelecionado?cartaoSelecionado.contaId:null) : fd.get('contaId')),
      cartaoId: usaCartao? fd.get('cartaoId') : null,
      ativo: r ? r.ativo!==false : true
    };
    if(r){ Object.assign(r,dados); tocar(r); }
    else{ state.recorrencias.push(tocar({id:uuid(),...dados,mesesGerados:[]})); }
    salvarEstado();
    gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
    fecharModal(); renderTudo(); toast(r?'Fixo mensal atualizado.':'Fixo mensal adicionado.');
  });
  abrirModal();
}
function toggleRecorrencia(id){
  const r=state.recorrencias.find(x=>x.id===id); if(!r) return;
  r.ativo = r.ativo===false ? true : false; tocar(r);
  salvarEstado(); renderTudo(); toast(r.ativo?'Reativado.':'Pausado — não vai mais gerar lançamento novo até você reativar.');
}
function excluirRecorrencia(id){
  if(!confirm('Excluir este fixo mensal? Os lançamentos que ele já gerou continuam existindo, só a recorrência futura para.')) return;
  excluirRegistro('recorrencias', id);
  salvarEstado(); renderTudo(); toast('Fixo mensal excluído.');
}

function pagarParcelaFinanciamento(id){
  const f=state.financiamentos.find(x=>x.id===id); if(!f) return;
  if(!confirm(`Marcar parcela ${f.parcelasPagas+1}/${f.parcelasTotal} de "${f.descricao}" como paga e lançar ${fmtMoney(f.valorParcela)} como despesa?`)) return;
  f.parcelasPagas++; tocar(f);
  let cat=state.categorias.find(c=>c.nome==='Taxas & Juros');
  state.transacoes.push(tocar({id:uuid(),descricao:`${f.descricao} (parcela ${f.parcelasPagas}/${f.parcelasTotal})`,
    data:todayStr(),valor:f.valorParcela,tipo:'despesa',categoriaId:cat?cat.id:null,
    metodoPagamento:'debito',contaId:f.contaId,status:'pago'}));
  salvarEstado(); renderTudo(); toast('Parcela registrada.');
}

function renderInvestimentos(){
  const el=document.getElementById('tab-investimentos');
  const total=totalInvestimentos();
  const aportado=state.investimentos.reduce((s,i)=>s+(Number(i.valorAportado)||0),0);
  const rentab=aportado? ((total-aportado)/aportado*100):0;
  const porTipo={};
  state.investimentos.forEach((i,idx)=>{
    if(!porTipo[i.tipo]) porTipo[i.tipo]={valor:0,cor:PALETA[Object.keys(porTipo).length%PALETA.length]};
    porTipo[i.tipo].valor+=Number(i.valorAtual)||0;
  });
  const catArr=Object.entries(porTipo).map(([nome,v])=>({nome,...v}));

  el.innerHTML=`
    <div class="section-title"><h2>Investimentos</h2><button class="btn btn-primary btn-sm" onclick="abrirFormInvestimento()">+ Novo</button></div>
    <div class="grid">
      <div class="card"><h3>Total investido (atual)</h3><div class="value">${fmtMoney(total)}</div></div>
      <div class="card"><h3>Total aportado</h3><div class="value">${fmtMoney(aportado)}</div></div>
      <div class="card"><h3>Rentabilidade</h3><div class="value ${rentab>=0?'income':'expense'}">${rentab.toFixed(1)}%</div></div>
    </div>
    ${catArr.length?`<div class="card mt16">${renderDonut(catArr)}</div>`:''}
    <div class="section-title"><h2>Meus investimentos</h2></div>
    <div class="list">${state.investimentos.length? state.investimentos.map(i=>{
      const ganho=(Number(i.valorAtual)||0)-(Number(i.valorAportado)||0);
      return `<div class="row-card">
        <div class="row-icon"><span class="px-ico" style="--i:url(assets/icons/chart.svg)"></span></div>
        <div class="row-main"><div class="t1">${escapeHtml(i.nome)}</div><div class="t2">${escapeHtml(i.tipo)} ${i.instituicao?'· '+escapeHtml(i.instituicao):''}</div></div>

          <button onclick="excluirInvestimento('${i.id}')" title="Excluir"><span class="px-ico" style="--i:url(assets/icons/trash.svg)"></span></button>
