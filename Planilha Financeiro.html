<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixinha</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icones/icon-192.png">
<link rel="apple-touch-icon" href="icones/icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#f2f4f9; --surface:#ffffff; --surface-2:#f6f7fb; --border:#e3e6ee;
  --text:#1b1f2a; --text-muted:#6b7280; --text-faint:#9aa1b1;
  --primary:#4f46e5; --primary-ink:#ffffff; --primary-soft:#eef0fe;
  --income:#16a34a; --income-soft:#e8f8ee;
  --expense:#e11d48; --expense-soft:#fdeaef;
  --warning:#f59e0b; --warning-soft:#fef3e0;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 8px 24px -12px rgba(20,24,40,.12);
}
html.dark{
  color-scheme:dark;
  --bg:#12141c; --surface:#1b1f2b; --surface-2:#242a3b; --border:#333a52;
  --text:#e8eaf2; --text-muted:#9aa1b8; --text-faint:#6b7280;
  --primary:#6366f1; --primary-ink:#ffffff; --primary-soft:#252a4d;
  --income:#22c55e; --income-soft:#12331f;
  --expense:#f43f5e; --expense-soft:#3a1420;
  --warning:#fbbf24; --warning-soft:#3a2c0c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:76px;
}
button,input,select,textarea{font-family:inherit; font-size:1rem; color:inherit;}
input::placeholder,textarea::placeholder{color:var(--text-faint); opacity:1;}
button{cursor:pointer;}
h1,h2,h3,p{margin:0;}
.hidden{display:none !important;}
a{color:inherit;}

/* ---------- Lock screen ---------- */
#lockScreen,#loginScreen,#loadingScreen{
  position:fixed; inset:0; background:linear-gradient(160deg,#4f46e5,#312e81);
  display:flex; align-items:center; justify-content:center; z-index:999; padding:20px;
}
.lock-card{
  background:var(--surface); border-radius:20px; padding:32px 28px; width:100%; max-width:340px;
  text-align:center; box-shadow:var(--shadow);
}
.lock-card .emoji{font-size:40px;}
.lock-card h2{margin:8px 0 4px; font-size:1.3rem;}
.lock-card p{color:var(--text-muted); font-size:.9rem; margin-bottom:18px;}
#lockInput{
  width:100%; text-align:center; letter-spacing:8px; font-size:1.4rem; padding:12px;
  border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:12px;
}
#lockError{color:var(--expense); font-size:.85rem; min-height:18px; margin-bottom:8px;}
.btn{
  border:none; border-radius:var(--radius-sm); padding:11px 16px; font-weight:600;
  background:var(--surface-2); color:var(--text);
}
.btn-primary{background:var(--primary); color:var(--primary-ink);}
.btn-primary:active{opacity:.85;}
.btn-block{width:100%;}
.btn-danger{background:var(--expense-soft); color:var(--expense);}
.btn-ghost{background:transparent; color:var(--text-muted);}
.btn-sm{padding:7px 10px; font-size:.82rem; border-radius:8px;}

/* ---------- App shell ---------- */
#app{max-width:1080px; margin:0 auto; padding:0 14px;}
.topbar{
  background:var(--bg);
  padding:14px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.topbar .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:1.05rem;}
.topbar .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--primary);}
.topbar .brand img{width:min(60vw,460px); height:auto; display:block;}
@media(max-width:680px){.topbar .brand img{width:min(80vw,380px);}}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:1rem;
}

nav.tabs{
  display:flex; gap:4px; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:4px; margin-bottom:16px; overflow-x:auto;
  position:sticky; top:0; z-index:55;
}
nav.tabs button{
  flex:1; white-space:nowrap; border:none; background:transparent; padding:9px 10px;
  border-radius:9px; font-weight:600; font-size:.82rem; color:var(--text-muted);
}
nav.tabs button.active{background:var(--primary); color:var(--primary-ink);}

section.tab{display:none;}
section.tab.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}

/* ---------- Cards / grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow);
}
.card h3{font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:700; margin-bottom:6px;}
.card .value{font-size:1.5rem; font-weight:800;}
.card .sub{font-size:.8rem; color:var(--text-muted); margin-top:2px;}
.value.income{color:var(--income);}
.value.expense{color:var(--expense);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
.section-title h2{font-size:1rem; font-weight:800;}

.list{display:flex; flex-direction:column; gap:8px;}
.row-card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:12px;
}
.row-icon{
  width:38px; height:38px; border-radius:10px; background:var(--surface-2); flex:none;
  display:flex; align-items:center; justify-content:center; font-size:1.15rem;
}
.icon-input{
  width:38px; height:38px; border-radius:10px; background:var(--surface-2); flex:none;
  text-align:center; font-size:1.15rem; padding:0; border:1px solid transparent; color:var(--text);
}
.icon-input:focus{ border-color:var(--primary); outline:none; }
.row-main{flex:1; min-width:0;}
.row-main .t1{font-weight:700; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row-main .t2{font-size:.78rem; color:var(--text-muted); margin-top:2px;}
.row-value{font-weight:800; font-size:.95rem; white-space:nowrap;}
.row-value.income{color:var(--income);} .row-value.expense{color:var(--expense);}
.row-actions{display:flex; gap:6px;}
.row-actions button{background:none; border:none; font-size:1rem; color:var(--text-faint); padding:4px;}

.empty-state{
  text-align:center; padding:36px 16px; color:var(--text-muted); background:var(--surface);
  border:1px dashed var(--border); border-radius:var(--radius); font-size:.9rem;
}
.empty-state .emoji{font-size:1.8rem; display:block; margin-bottom:6px;}

.progress{height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; margin-top:8px;}
.progress > div{height:100%; background:var(--primary); border-radius:5px;}
.progress.warn > div{background:var(--warning);}
.progress.danger > div{background:var(--expense);}

.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:.7rem; font-weight:700;}
.badge.pago{background:var(--income-soft); color:var(--income);}
.badge.pendente{background:var(--warning-soft); color:var(--warning);}

/* ---------- Filters / toolbar ---------- */
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.toolbar input[type=text],.toolbar select{
  padding:9px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); flex:1; min-width:120px;
}

/* ---------- Forms / Modal ---------- */
#modalRoot{position:fixed; inset:0; z-index:200; display:flex; align-items:flex-end; justify-content:center;}
#modalRoot.hidden{display:none;}
.modal-backdrop{position:absolute; inset:0; background:rgba(15,17,26,.5);}
.modal-card{
  position:relative; background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:20px 18px 24px; box-shadow:var(--shadow);
}
@media(min-width:640px){
  #modalRoot{align-items:center;}
  .modal-card{border-radius:18px; margin-bottom:0;}
}
.modal-card h2{font-size:1.05rem; margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:.78rem; font-weight:700; color:var(--text-muted); margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2);
}
.field textarea{resize:vertical; min-height:56px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.seg{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
.seg button{flex:1; padding:9px; background:var(--surface-2); border:none; font-weight:700; font-size:.82rem; color:var(--text-muted);}
.seg button.active{background:var(--primary); color:#fff;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions .btn{flex:1;}
.close-x{position:absolute; top:14px; right:14px; background:none; border:none; font-size:1.2rem; color:var(--text-faint);}

/* ---------- Toast ---------- */
#toastRoot{position:fixed; left:0; right:0; bottom:90px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:300; pointer-events:none;}
.toast{background:#1b1f2a; color:#fff; padding:10px 16px; border-radius:30px; font-size:.85rem; box-shadow:var(--shadow); opacity:0; transform:translateY(6px); transition:all .2s;}
.toast.show{opacity:1; transform:none;}

/* ---------- Mobile bottom nav ---------- */
@media(max-width:680px){
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:80; margin:0; border-radius:0;
    border-left:none; border-right:none; border-bottom:none; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:var(--surface);
  }
  nav.tabs button{font-size:.66rem; padding:8px 4px; display:flex; flex-direction:column; gap:2px;}
  nav.tabs button .ico{font-size:1.05rem;}
  #app{padding:0 10px;}
}
.ico{display:none;}
@media(max-width:680px){.ico{display:block;}}

/* misc */
.muted{color:var(--text-muted);}
.mt8{margin-top:8px;} .mt16{margin-top:16px;}
.two-col{display:grid; grid-template-columns:1fr; gap:16px;}
@media(min-width:800px){.two-col{grid-template-columns:1.3fr 1fr;}}
.chart-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.legend{display:flex; flex-direction:column; gap:6px; font-size:.8rem; flex:1; min-width:150px;}
.legend .li{display:flex; align-items:center; gap:8px;}
.legend .sw{width:10px; height:10px; border-radius:3px; flex:none;}
.legend .lbl{flex:1; color:var(--text-muted);}
.legend .val{font-weight:700;}
.hint{font-size:.78rem; color:var(--text-muted); margin-top:6px; line-height:1.4;}
table.simple{width:100%; border-collapse:collapse; font-size:.85rem;}
table.simple th{text-align:left; color:var(--text-muted); font-size:.72rem; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border);}
table.simple td{padding:8px; border-bottom:1px solid var(--border);}
.color-dot{width:12px; height:12px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:6px; border:2px solid #fff; box-shadow:0 0 0 1px var(--border);}
.swatches{display:flex; flex-wrap:wrap; gap:6px;}
.swatches span{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.swatches span.sel{border-color:var(--text);}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="lock-card"><div class="emoji">🧮</div><p style="margin:0">Carregando…</p></div>
</div>

<div id="loginScreen" class="hidden">
  <div class="lock-card">
    <div class="emoji">👤</div>
    <h2>Caixinha</h2>
    <p>Entre com seu e-mail para sincronizar seus dados entre aparelhos</p>
    <div class="field" style="text-align:left"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field" style="text-align:left"><label>Senha</label><input id="loginSenha" type="password" autocomplete="current-password"></div>
    <div id="loginError" style="color:var(--expense); font-size:.85rem; min-height:18px; margin-bottom:8px"></div>
    <button class="btn btn-primary btn-block" onclick="fbLogin()">Entrar</button>
    <button class="btn btn-ghost btn-block mt16" onclick="fbSignup()">Criar conta nova</button>
  </div>
</div>

<div id="lockScreen" class="hidden">
  <div class="lock-card">
    <div class="emoji">🔒</div>
    <h2>Caixinha</h2>
    <p>Digite seu PIN para continuar</p>
    <input id="lockInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div id="lockError"></div>
    <button class="btn btn-primary btn-block" onclick="tentarDesbloquear()">Entrar</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand"><img src="icones/logo-web.png" alt="Caixinha"></div>
    <div id="seletorPerfil"></div>
  </div>

  <nav class="tabs">
    <button data-tab="dashboard" onclick="switchTab('dashboard')"><span class="ico">🏠</span>Início</button>
    <button data-tab="lancamentos" onclick="switchTab('lancamentos')"><span class="ico">🧾</span>Lançamentos</button>
    <button data-tab="contas" onclick="switchTab('contas')"><span class="ico">🏦</span>Contas</button>
    <button data-tab="parcelamentos" onclick="switchTab('parcelamentos')"><span class="ico">📆</span>Fixos</button>
    <button data-tab="investimentos" onclick="switchTab('investimentos')"><span class="ico">📈</span>Invest.</button>
    <button data-tab="config" onclick="switchTab('config')"><span class="ico">⚙️</span>Config</button>
  </nav>

  <main>
    <section id="tab-dashboard" class="tab"></section>
    <section id="tab-lancamentos" class="tab"></section>
    <section id="tab-contas" class="tab"></section>
    <section id="tab-parcelamentos" class="tab"></section>
    <section id="tab-investimentos" class="tab"></section>
    <section id="tab-config" class="tab"></section>
  </main>
</div>

<div id="modalRoot" class="hidden">
  <div class="modal-backdrop" onclick="fecharModal()"></div>
  <div class="modal-card" id="modalCard"></div>
</div>
<div id="toastRoot"></div>

<script>
/* ================= Utilidades ================= */
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function fmtMonthLabel(y,m){ const d=new Date(y,m,1); return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',''); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function addMonths(dateStr,n){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1+n,1);
  const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
  dt.setDate(Math.min(d,last));
  return dt.toISOString().slice(0,10);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toastRoot').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); },2400);
}
const PALETA=['#4f46e5','#16a34a','#e11d48','#f59e0b','#0891b2','#9333ea','#db2777','#65a30d','#0284c7','#ea580c','#475569','#7c3aed'];

/* ================= Estado / Storage ================= */
function storageKey(perfil){ return perfil==='pj' ? 'planilhaFinanceiro_v1_pj' : 'planilhaFinanceiro_v1'; }
let state=null;
let perfilAtivo='pessoal';
const estados={pessoal:null, pj:null}; // os dois perfis ficam em memória o tempo todo, sincronizando em paralelo

function categoriasDefault(){
  const desp=[['Alimentação','🍔'],['Mercado','🛒'],['Transporte','🚗'],['Moradia','🏠'],
    ['Contas & Utilidades','💡'],['Saúde','💊'],['Educação','📚'],['Lazer','🎮'],
    ['Assinaturas','📺'],['Compras','🛍️'],['Cuidados Pessoais','💇'],['Pets','🐾'],
    ['Viagem','✈️'],['Presentes & Doações','🎁'],['Taxas & Juros','🏦'],['Outros','📦']];
  const rec=[['Salário','💼'],['Freelance','💻'],['Rendimentos','📈'],['Presente Recebido','🎉'],
    ['Reembolso','↩️'],['Outros (receita)','💰']];
  let i=0; const out=[];
  desp.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'despesa',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  rec.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'receita',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  return out;
}
function categoriasDefaultPJ(){
  const desp=[['Impostos (DAS)','🧾'],['Pró-labore','💸'],['Contador','📋'],['Fornecedores','📦'],
    ['Ferramentas & Softwares','💻'],['Marketing','📣'],['Taxas Bancárias','🏦'],['Outros (PJ)','📎']];
  const rec=[['Nota Fiscal Emitida','🧾'],['Vendas & Serviços','💰'],['Outros (receita PJ)','💰']];
  let i=0; const out=[];
  desp.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'despesa',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  rec.forEach(([nome,icone])=>out.push({id:uuid(),nome,icone,tipo:'receita',cor:PALETA[i++%PALETA.length],updatedAt:nowISO()}));
  return out;
}
const CHAVES_SINCRONIZAVEIS=['contas','cartoes','categorias','transacoes','financiamentos','investimentos','recorrencias'];

function estadoInicial(){
  return {
    version:1,
    contas:[{id:uuid(),nome:'Carteira',tipo:'dinheiro',saldoInicial:0,cor:PALETA[0],ativo:true,updatedAt:nowISO()}],
    cartoes:[],
    categorias:categoriasDefault(),
    transacoes:[],
    financiamentos:[],
    investimentos:[],
    recorrencias:[],
    config:{pinHash:null,onboardingConcluido:false},
    _tombstones:{}
  };
}
function estadoInicialPJ(nomeEmpresa){
  return {
    version:1,
    empresaNome:nomeEmpresa||'',
    contas:[],
    cartoes:[],
    categorias:categoriasDefaultPJ(),
    transacoes:[],
    financiamentos:[],
    investimentos:[],
    recorrencias:[],
    config:{pinHash:null,onboardingConcluido:true},
    _tombstones:{}
  };
}
function estadoVazio(){
  return {version:1,contas:[],cartoes:[],categorias:[],transacoes:[],financiamentos:[],investimentos:[],recorrencias:[],config:{pinHash:null},_tombstones:{}};
}
function normalizarEstado(alvo){
  if(!alvo.financiamentos) alvo.financiamentos=[];
  if(!alvo.recorrencias) alvo.recorrencias=[];
  alvo.recorrencias.forEach(r=>{ if(!r.intervaloMeses) r.intervaloMeses=1; });
  if(!alvo._tombstones) alvo._tombstones={};
  alvo.cartoes.forEach(c=>{ if(!c.tipo) c.tipo='credito'; });
  if(!alvo.config) alvo.config={pinHash:null};
  if(alvo.config.onboardingConcluido===undefined){
    // usuário de antes desse recurso existir: se já tem dado de verdade, não é "primeira vez"
    alvo.config.onboardingConcluido = alvo.transacoes.length>0 || alvo.contas.length>1 || alvo.recorrencias.length>0 || alvo.cartoes.length>0;
  }
  return alvo;
}
let estadoEraNovo=false;
function carregarPerfilLocal(perfil){
  try{
    const raw=localStorage.getItem(storageKey(perfil));
    if(raw) return normalizarEstado(JSON.parse(raw));
  }catch(e){ /* segue pro fallback abaixo */ }
  return null;
}
function carregarEstado(){
  estados.pessoal=carregarPerfilLocal('pessoal');
  if(!estados.pessoal){ estados.pessoal=estadoInicial(); estadoEraNovo=true; }
  estados.pj=carregarPerfilLocal('pj'); // fica null se o usuário nunca criou perfil PJ
  perfilAtivo = (localStorage.getItem('planilhaFinanceiro_perfilAtivo')==='pj' && estados.pj) ? 'pj' : 'pessoal';
  state=estados[perfilAtivo];
}
function trocarPerfil(perfil){
  if(perfil==='pj' && !estados.pj) return;
  perfilAtivo=perfil;
  localStorage.setItem('planilhaFinanceiro_perfilAtivo',perfil);
  state=estados[perfil];
  aplicarTema();
  renderTudo();
}
function aplicarTema(){
  document.documentElement.classList.toggle('dark', !!state.config.temaEscuro);
}
function definirTema(escuro){
  state.config.temaEscuro=escuro;
  salvarEstado(); aplicarTema(); renderConfig();
}
// Exclusão registra um "tombstone" (marcador de excluído) em vez de só sumir do array —
// sem isso, sincronizar com outro aparelho traria o registro apagado de volta (merge só sabe unir, não apagar).
function excluirRegistro(chave,id){
  const arr=state[chave];
  const idx=arr.findIndex(r=>r.id===id);
  if(idx===-1) return;
  arr.splice(idx,1);
  if(!state._tombstones[chave]) state._tombstones[chave]=[];
  state._tombstones[chave].push({id,updatedAt:nowISO()});
}
function salvarEstado(){
  try{
    localStorage.setItem(storageKey(perfilAtivo),JSON.stringify(state));
  }catch(e){
    alert('Não foi possível salvar os dados neste navegador (armazenamento local indisponível ou cheio). Faça um backup manual pelo botão "Fazer backup" para não perder nada.');
  }
  if(typeof sincronizarComFirestore==='function') sincronizarComFirestore();
}
function tocar(obj){ obj.updatedAt=nowISO(); return obj; }

/* ================= Hash (PIN) ================= */
async function hashTexto(txt){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(const c of txt){ h=(h*31 + c.charCodeAt(0))|0; }
    return 'fallback_'+h;
  }
}

/* ================= Lock screen ================= */
async function tentarDesbloquear(){
  const input=document.getElementById('lockInput');
  const hash=await hashTexto(input.value);
  if(hash===state.config.pinHash){
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    input.value='';
    document.getElementById('lockError').textContent='';
    possivelmenteAbrirWizard();
  }else{
    document.getElementById('lockError').textContent='PIN incorreto.';
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lockInput')?.addEventListener('keydown',e=>{ if(e.key==='Enter') tentarDesbloquear(); });
});
function bloquearApp(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('lockInput').focus();
}

/* ================= Helpers de domínio ================= */
function contaById(id){ return state.contas.find(c=>c.id===id); }
function cartaoById(id){ return state.cartoes.find(c=>c.id===id); }
function categoriaById(id){ return state.categorias.find(c=>c.id===id); }
function metodosPagamento(){
  return [
    {id:'dinheiro',nome:'Dinheiro',icone:'💵'},
    {id:'debito',nome:'Débito',icone:'💳'},

    {id:'boleto',nome:'Boleto',icone:'🧾'},
    {id:'transferencia',nome:'Transferência',icone:'🔁'}
  ];
}
function metodoInfo(id){ return metodosPagamento().find(m=>m.id===id) || {nome:id,icone:'💠'}; }

function saldoConta(contaId){
  const conta=contaById(contaId); if(!conta) return 0;
  let saldo=Number(conta.saldoInicial)||0;
  const hoje=todayStr();
  state.transacoes.forEach(t=>{
    if(t.metodoPagamento==='credito') return;
    if(t.data>hoje) return;
    if(t.tipo==='receita' && t.contaId===contaId) saldo+=t.valor;
    else if(t.tipo==='despesa' && t.contaId===contaId) saldo-=t.valor;
    else if(t.tipo==='transferencia'){
      if(t.contaId===contaId) saldo-=t.valor;
      if(t.contaDestinoId===contaId) saldo+=t.valor;
    }
  });
  return saldo;
}
function saldoTotalContas(){
  return state.contas.filter(c=>c.ativo!==false).reduce((s,c)=>s+saldoConta(c.id),0);
}
function inicioCicloCartao(cartao,ref){
  ref=ref||new Date();
  const dia=cartao.diaFechamento||1;
  let d=new Date(ref.getFullYear(),ref.getMonth(),dia);
  if(ref.getDate()<dia) d=new Date(ref.getFullYear(),ref.getMonth()-1,dia);
  return d;
}
function faturaAtualCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao) return 0;
  const inicio=inicioCicloCartao(cartao);
  const fim=new Date(inicio); fim.setMonth(fim.getMonth()+1);
  const iso=d=>d.toISOString().slice(0,10);
  return state.transacoes.filter(t=>t.metodoPagamento==='credito' && t.cartaoId===cartaoId && t.data>=iso(inicio) && t.data<iso(fim))
    .reduce((s,t)=>s+t.valor,0);
}
function divendaTotalCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao) return 0;
  if(cartao.titular) return vocDeveNoCartao(cartaoId);
  const inicio=inicioCicloCartao(cartao);
  const iso=inicio.toISOString().slice(0,10);
  return state.transacoes.filter(t=>t.metodoPagamento==='credito' && t.cartaoId===cartaoId && t.data>=iso)
    .reduce((s,t)=>s+t.valor,0);
}
function vocDeveNoCartao(cartaoId){
  const cartao=cartaoById(cartaoId); if(!cartao) return 0;
  const gasto=state.transacoes.filter(t=>t.cartaoId===cartaoId && t.tipo==='despesa').reduce((s,t)=>s+t.valor,0);
  return Math.max(0, round2(gasto - (cartao.pagamentosFeitos||0)));
}
function totalDividaCartoes(){
  return state.cartoes.reduce((s,c)=>s+divendaTotalCartao(c.id),0);
}
function totalInvestimentos(){
  return state.investimentos.reduce((s,i)=>s+(Number(i.valorAtual)||0),0);
}
function patrimonioLiquido(){
  return saldoTotalContas() + totalInvestimentos() - totalDividaCartoes();
}
function mesAtualRange(){
  const hoje=new Date();
  const ini=new Date(hoje.getFullYear(),hoje.getMonth(),1).toISOString().slice(0,10);
  const fim=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).toISOString().slice(0,10);
  return [ini,fim];
}
function transacoesDoMes(ini,fim){
  return state.transacoes.filter(t=>t.data>=ini && t.data<=fim);
}
function pad2(n){ return String(n).padStart(2,'0'); }
function ultimoDiaDoMes(ano,mesIdx){ return new Date(ano,mesIdx+1,0).getDate(); }
function anoMesStr(ano,mesIdx){ return `${ano}-${pad2(mesIdx+1)}`; }
function rangeDoMes(ano,mesIdx){
  const ini=`${anoMesStr(ano,mesIdx)}-01`;
  const fim=`${anoMesStr(ano,mesIdx)}-${pad2(ultimoDiaDoMes(ano,mesIdx))}`;
  return [ini,fim];
}

/* ================= Recorrências (receitas/despesas fixas) ================= */
// intervaloMeses=1 é mensal (padrão); 3 = a cada 3 meses (ex: revisão); 12 = anual (ex: IPVA).
// mesInicio (YYYY-MM) é a âncora: o mês em que a repetição começa a contar.
function descricaoFrequenciaRecorrencia(r){
  const intervalo=r.intervaloMeses||1;
  if(intervalo===1) return `Todo dia ${r.diaDoMes}`;
  if(intervalo===12) return `Todo ano, dia ${r.diaDoMes}`;
  return `A cada ${intervalo} meses, dia ${r.diaDoMes}`;
}
function recorrenciaDevidaNoMes(r,ano,mesIdx){
  const intervalo=r.intervaloMeses||1;
  if(intervalo<=1) return true;
  if(!r.mesInicio) return true;
  const [ai,mi]=r.mesInicio.split('-').map(Number);
  const diff=(ano*12+mesIdx)-(ai*12+(mi-1));
  return diff>=0 && diff%intervalo===0;
}
function gerarTransacoesRecorrentesDoMes(ano,mesIdx){
  const anoMes=anoMesStr(ano,mesIdx);
  const hoje=todayStr();
  let mudou=false;
  (state.recorrencias||[]).forEach(r=>{
    if(r.ativo===false) return;
    if((r.mesesGerados||[]).includes(anoMes)) return;
    if(!recorrenciaDevidaNoMes(r,ano,mesIdx)) return;
    const dia=Math.min(r.diaDoMes||1, ultimoDiaDoMes(ano,mesIdx));
    const data=`${anoMes}-${pad2(dia)}`;
    state.transacoes.push(tocar({id:uuid(),descricao:r.descricao,data,valor:r.valor,tipo:r.tipo,
      categoriaId:r.categoriaId,metodoPagamento:r.metodoPagamento,
      contaId:r.contaId, cartaoId:r.cartaoId,
      status:data<=hoje?'pago':'pendente',recorrenciaId:r.id,notas:''}));
    if(!r.mesesGerados) r.mesesGerados=[];
    r.mesesGerados.push(anoMes); tocar(r);
    mudou=true;
  });
  if(mudou) salvarEstado();
}
function transacoesEfetivasDoMes(ano,mesIdx){
  const [ini,fim]=rangeDoMes(ano,mesIdx);
  const reais=state.transacoes.filter(t=>t.data>=ini && t.data<=fim);
  const anoMes=anoMesStr(ano,mesIdx);
  const anoMesAtual=anoMesStr(new Date().getFullYear(),new Date().getMonth());
  if(anoMes<anoMesAtual) return reais;
  const idsComReal=new Set(reais.filter(t=>t.recorrenciaId).map(t=>t.recorrenciaId));
  const virtuais=(state.recorrencias||[]).filter(r=>r.ativo!==false && !idsComReal.has(r.id) && !(r.mesesGerados||[]).includes(anoMes) && recorrenciaDevidaNoMes(r,ano,mesIdx)).map(r=>{
    const dia=Math.min(r.diaDoMes||1, ultimoDiaDoMes(ano,mesIdx));
    const data=`${anoMes}-${pad2(dia)}`;
    return {id:'virtual_'+r.id+'_'+anoMes,descricao:r.descricao,data,valor:r.valor,tipo:r.tipo,
      categoriaId:r.categoriaId,metodoPagamento:r.metodoPagamento,contaId:r.contaId,cartaoId:r.cartaoId,
      status:'pendente',recorrenciaId:r.id,virtual:true};
  });
  return [...reais, ...virtuais];
}
function gastosPorBancoDoMes(doMes){
  const porBanco={};
  doMes.filter(t=>t.tipo==='despesa').forEach(t=>{
    const contaId = t.metodoPagamento==='credito' ? cartaoById(t.cartaoId)?.contaId : t.contaId;
    const conta = contaId ? contaById(contaId) : null;
    if(!conta) return;
    if(!porBanco[conta.nome]) porBanco[conta.nome]={valor:0,cor:conta.cor};
    porBanco[conta.nome].valor+=t.valor;
  });
  return Object.entries(porBanco).map(([nome,v])=>({nome,...v})).sort((a,b)=>b.valor-a.valor);
}

function renderDonut(catArr){
  const total=catArr.reduce((s,c)=>s+c.valor,0);
  let acc=0; const r=52,cx=60,cy=60,circ=2*Math.PI*r;
  const arcs=catArr.map(c=>{
    const frac=c.valor/total; const dash=frac*circ;
    const offset=circ-acc*circ; acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.cor}" stroke-width="16"
      stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=catArr.slice(0,8).map(c=>`<div class="li"><span class="sw" style="background:${c.cor}"></span><span class="lbl">${escapeHtml(c.nome)}</span><span class="val">${fmtMoney(c.valor)}</span></div>`).join('');
  return `<div class="chart-wrap mt8">
    <svg width="120" height="120" viewBox="0 0 120 120">${arcs}<circle cx="60" cy="60" r="34" fill="var(--surface)"/></svg>
    <div class="legend">${legend}</div>
  </div>`;
}
function renderCartoesResumo(){
  const cartoesCredito=state.cartoes.filter(c=>c.tipo!=='debito');
  if(!cartoesCredito.length) return '<div class="empty-state"><span class="emoji">💳</span>Nenhum cartão de crédito cadastrado ainda.</div>';
  return `<div class="grid">${cartoesCredito.map(c=>{
    const uso=divendaTotalCartao(c.id);
    if(c.titular){
      return `<div class="card">
        <h3>${escapeHtml(c.nome)}</h3>
        <div class="value">${fmtMoney(uso)}</div>
        <div class="sub">você deve pra ${escapeHtml(c.titular)}</div>
      </div>`;
    }
    const pct=c.limite? Math.min(100,Math.round(uso/c.limite*100)):0;
    const cls=pct>=90?'danger':pct>=70?'warn':'';
    return `<div class="card">
      <h3>${escapeHtml(c.nome)}</h3>
      <div class="value">${fmtMoney(uso)}</div>
      <div class="sub">de ${fmtMoney(c.limite||0)} de limite · fecha dia ${c.diaFechamento||'-'}</div>
      <div class="progress ${cls}"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join('')}</div>`;
}

function renderListaLancamentos(){

  else if(filtroLanc.periodo==='30'){ const d=new Date(); d.setDate(d.getDate()-30); lista=lista.filter(t=>t.data>=d.toISOString().slice(0,10)); }
  if(filtroLanc.tipo) lista=lista.filter(t=>t.tipo===filtroLanc.tipo);
  if(filtroLanc.q) lista=lista.filter(t=>t.descricao.toLowerCase().includes(filtroLanc.q.toLowerCase()));
  lista.sort((a,b)=>b.data.localeCompare(a.data));

  if(!lista.length){ cont.innerHTML='<div class="empty-state"><span class="emoji">🧾</span>Nenhum lançamento encontrado.</div>'; return; }

    const cat=categoriaById(t.categoriaId);

        <div class="t2">${fmtDate(t.data)} · ${met.icone} ${met.nome}${local?' · '+escapeHtml(local):''} <span class="badge ${t.status||'pago'}">${t.status||'pago'}</span></div>
      </div>

  }).join('');

        <div class="field"><label>Data</label><input required type="date" name="data" value="${t?t.data:todayStr()}"></div>
      </div>
      <div class="field" id="campoCategoria"><label>Categoria</label>
        <select name="categoriaId">${state.categorias.filter(c=>c.tipo===tipo||tipo==='transferencia').map(c=>`<option value="${c.id}" ${t&&t.categoriaId===c.id?'selected':''}>${c.icone} ${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Método de pagamento</label>
        <select name="metodoPagamento" id="selMetodo">${metodosPagamento().map(m=>`<option value="${m.id}" ${t&&t.metodoPagamento===m.id?'selected':''}>${m.icone} ${m.nome}</option>`).join('')}</select>
      </div>
      <div class="field" id="campoConta"><label>Conta</label>
        <select name="contaId">${state.contas.map(c=>`<option value="${c.id}" ${t&&t.contaId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field hidden" id="campoContaDestino"><label>Conta de destino</label>
        <select name="contaDestinoId">${state.contas.map(c=>`<option value="${c.id}" ${t&&t.contaDestinoId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field hidden" id="campoCartao"><label>Cartão</label>
        <select name="cartaoId">${state.cartoes.map(c=>`<option value="${c.id}" ${t&&t.cartaoId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      ${!t?`<div class="field" id="campoParcelas"><label>Parcelar em quantas vezes?</label><input type="number" min="1" max="120" name="parcelas" value="1"></div>`:''}
      <div class="field"><label>Notas (opcional)</label><textarea name="notas">${t?escapeHtml(t.notas||''):''}</textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">${t?'Salvar':'Adicionar'}</button>
      </div>
    </form>
  `;
  const form=document.getElementById('formTransacao');
  const segBtns=form.querySelectorAll('#segTipo button');
  function setTipo(v){
    segBtns.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
    document.getElementById('campoContaDestino').classList.toggle('hidden',v!=='transferencia');
    document.getElementById('campoCategoria').classList.toggle('hidden',v==='transferencia');

  }
  segBtns.forEach(b=>b.addEventListener('click',()=>setTipo(b.dataset.v)));
  function metodoMudou(){
    const v=form.metodoPagamento.value;
    const usaCartao = v==='credito' || v==='debito';
    document.getElementById('campoCartao').classList.toggle('hidden',!usaCartao);
    document.getElementById('campoConta').classList.toggle('hidden',usaCartao);
    if(usaCartao){
      const cartoesFiltrados=state.cartoes.filter(c=>c.tipo===v);

    const fd=new FormData(form);
    const tipoSel=form.querySelector('#segTipo button.active').dataset.v;
    const valor=round2(parseFloat(fd.get('valor')));
    const parcelas=Math.max(1,parseInt(fd.get('parcelas')||1));
    const metodo=fd.get('metodoPagamento');
    const usaCartao = metodo==='credito' || metodo==='debito';
    if(usaCartao && !fd.get('cartaoId')){
      alert(`Cadastre um cartão de ${metodo==='credito'?'crédito':'débito'} em Contas antes de lançar com esse método.`);
      return;
    }
    const cartaoSelecionado = usaCartao ? cartaoById(fd.get('cartaoId')) : null;
    const base={
      descricao:fd.get('descricao').trim(),
      data:fd.get('data'),
      tipo:tipoSel,
      categoriaId: tipoSel==='transferencia'? null : fd.get('categoriaId'),
      metodoPagamento:metodo,

      notas:fd.get('notas').trim()
    };
    if(t){
      Object.assign(t,base,{valor}); tocar(t);
    }else if(fd.get('metodoPagamento')==='credito' && parcelas>1){
      const grupoId=uuid();
      const parcelaBase=round2(valor/parcelas);
      const hoje=todayStr();
      for(let i=1;i<=parcelas;i++){
        const data=addMonths(base.data,i-1);
        const v = i===parcelas ? round2(valor-parcelaBase*(parcelas-1)) : parcelaBase;
        state.transacoes.push(tocar({id:uuid(),...base,data,valor:v,
          descricao:`${base.descricao}`,
          parcelaGrupoId:grupoId,parcelaAtual:i,parcelaTotal:parcelas,
          status: data<=hoje?'pago':'pendente'}));
      }
    }else{
      state.transacoes.push(tocar({id:uuid(),...base,valor,status: base.data<=todayStr()?'pago':'pendente'}));
    }
    salvarEstado(); fecharModal(); renderTudo(); toast(t?'Lançamento atualizado.':'Lançamento adicionado.');

    const restante=arr.filter(t=>t.data>hoje).reduce((s,t)=>s+t.valor,0);
    const prox=arr.find(t=>t.data>hoje);
    return {desc:arr[0].descricao,pagas,total,restante,prox,valorTotal:arr.reduce((s,t)=>s+t.valor,0)};

          <div class="t1">${escapeHtml(r.descricao)}${pausado?' <span class="badge pendente">pausado</span>':''}</div>

        <div class="row-value ${r.tipo==='receita'?'income':'expense'}">${r.tipo==='receita'?'+':'-'}${fmtMoney(r.valor)}</div>
        <div class="row-actions">
          <button onclick="abrirFormRecorrencia('${r.id}')" title="Editar">✏️</button>

          <button onclick="excluirRecorrencia('${r.id}')" title="Excluir">🗑️</button>

    <div class="section-title"><h2>Compras parceladas em aberto</h2><button class="btn btn-primary btn-sm" onclick="abrirFormParcelamento()">+ Novo</button></div>

      const pct=Math.round(g.pagas/g.total*100);
      return `<div class="row-card" style="align-items:flex-start">
        <div class="row-icon">📆</div>
        <div class="row-main">
          <div class="t1">${escapeHtml(g.desc)}</div>

      <div class="field"><label>Método de pagamento</label>
        <select name="metodoPagamento" id="selMetodoRec">${metodosPagamento().filter(m=>m.id!=='transferencia').map(m=>`<option value="${m.id}" ${r&&r.metodoPagamento===m.id?'selected':''}>${m.icone} ${m.nome}</option>`).join('')}</select>
      </div>
      <div class="field" id="campoContaRec"><label>Conta</label>
        <select name="contaId">${state.contas.map(c=>`<option value="${c.id}" ${r&&r.contaId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select>
      </div>
      <div class="field hidden" id="campoCartaoRec"><label>Cartão</label>
        <select name="cartaoId"></select>
      </div>
      <p class="hint">Editar um fixo já existente só muda os meses futuros — o lançamento deste mês (se já tiver sido gerado) você ajusta direto em Lançamentos.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">${r?'Salvar':'Adicionar'}</button>
      </div>
    </form>
  `;
  const form=document.getElementById('formRecorrencia');
  const segBtns=form.querySelectorAll('#segTipoRec button');
  function setTipo(v){
    segBtns.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
    const catSel=form.categoriaId;
    catSel.innerHTML=state.categorias.filter(c=>c.tipo===v).map(c=>`<option value="${c.id}">${c.icone} ${escapeHtml(c.nome)}</option>`).join('');
  }
  segBtns.forEach(b=>b.addEventListener('click',()=>setTipo(b.dataset.v)));
  function metodoMudou(){
    const v=form.metodoPagamento.value;
    const usaCartao = v==='credito' || v==='debito';
    document.getElementById('campoCartaoRec').classList.toggle('hidden',!usaCartao);
    document.getElementById('campoContaRec').classList.toggle('hidden',usaCartao);
    if(usaCartao){
      const cartoesFiltrados=state.cartoes.filter(c=>c.tipo===v);
      const label=document.querySelector('#campoCartaoRec label');
      if(label) label.textContent = v==='credito' ? 'Cartão de crédito' : 'Cartão de débito';
      form.cartaoId.innerHTML = cartoesFiltrados.length
        ? cartoesFiltrados.map(c=>`<option value="${c.id}" ${r&&r.cartaoId===c.id?'selected':''}>${escapeHtml(c.nome)}${c.titular?` (de ${escapeHtml(c.titular)})`:''}</option>`).join('')
        : `<option value="">Nenhum cartão de ${v==='credito'?'crédito':'débito'} cadastrado</option>`;
    }
  }
  form.metodoPagamento.addEventListener('change',metodoMudou);
  metodoMudou();

  const segModoBtns=form.querySelectorAll('#segModoRec button');
  function atualizaCamposRepeticao(){
    const modo=form.querySelector('#segModoRec button.active').dataset.v;
    const ehAnual=modo==='ano';
    document.getElementById('campoQtdMesesRec').classList.toggle('hidden',ehAnual);
    const mensal=!ehAnual && parseInt(form.intervaloMesesQtd.value)===1;
    document.getElementById('campoMesInicioRec').classList.toggle('hidden',mensal);
  }
  segModoBtns.forEach(b=>b.addEventListener('click',()=>{
    segModoBtns.forEach(x=>x.classList.toggle('active',x===b));
    atualizaCamposRepeticao();
  }));
  form.intervaloMesesQtd.addEventListener('input',atualizaCamposRepeticao);
  atualizaCamposRepeticao();

  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const tipoSel=form.querySelector('#segTipoRec button.active').dataset.v;
    const metodo=fd.get('metodoPagamento');
    const usaCartao = metodo==='credito' || metodo==='debito';
    if(usaCartao && !fd.get('cartaoId')){
      alert(`Cadastre um cartão de ${metodo==='credito'?'crédito':'débito'} em Contas antes de criar esse fixo.`);
      return;
    }
    const cartaoSelecionado = usaCartao ? cartaoById(fd.get('cartaoId')) : null;
    const modoRepeticao=form.querySelector('#segModoRec button.active').dataset.v;
    const intervaloMeses = modoRepeticao==='ano' ? 12 : Math.min(11,Math.max(1,parseInt(fd.get('intervaloMesesQtd'))||1));
    const dados={
      descricao:fd.get('descricao').trim(),
      valor:round2(parseFloat(fd.get('valor'))),
      diaDoMes:Math.min(31,Math.max(1,parseInt(fd.get('diaDoMes')))),
      intervaloMeses,
      mesInicio: intervaloMeses>1 ? fd.get('mesInicio') : null,
      tipo:tipoSel,
      categoriaId:fd.get('categoriaId'),
      metodoPagamento:metodo,
      contaId: metodo==='credito'? null : (metodo==='debito'? (cartaoSelecionado?cartaoSelecionado.contaId:null) : fd.get('contaId')),
      cartaoId: usaCartao? fd.get('cartaoId') : null,
      ativo:true
    };
    if(r){ Object.assign(r,dados); tocar(r); }
    else{ state.recorrencias.push(tocar({id:uuid(),...dados,mesesGerados:[]})); }
    salvarEstado();
    gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
    fecharModal(); renderTudo(); toast(r?'Fixo mensal atualizado.':'Fixo mensal adicionado.');
  });
  abrirModal();
}

function nomeArquivoBackup(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `backup_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}.json`;
}
async function fazerBackup(){
  const paraExportar={...state,config:{...state.config,pinHash:null}};
  const conteudo=JSON.stringify(paraExportar,null,2);
  if('showSaveFilePicker' in window){
    try{
      const opts={suggestedName:nomeArquivoBackup(),types:[{description:'Backup JSON',accept:{'application/json':['.json']}}]};
      if(ultimoHandleBackup) opts.startIn=ultimoHandleBackup;
      const handle=await window.showSaveFilePicker(opts);
      const writable=await handle.createWritable();
      await writable.write(conteudo); await writable.close();
      ultimoHandleBackup=handle;
      toast('Backup salvo com sucesso.'); return;
    }catch(e){ if(e.name==='AbortError') return; }
  }
  const blob=new Blob([conteudo],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=nomeArquivoBackup();
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup baixado — mova para a pasta backups.');
}
function importarBackup(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=JSON.parse(reader.result);
      mesclarEstado(incoming);
      gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
      salvarEstado(); aplicarTema(); renderTudo();
      toast('Backup importado e mesclado com sucesso.');
    }catch(e){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
  document.getElementById('inputImportar').value='';
}
function mesclarEstadoEm(alvo,incoming){
  if(!alvo._tombstones) alvo._tombstones={};
  const tumbasIncoming=incoming._tombstones||{};

  CHAVES_SINCRONIZAVEIS.forEach(chave=>{
    // 1) mescla os tombstones (mantém o mais recente por id)
    const tumbaPorId={};
    (alvo._tombstones[chave]||[]).forEach(t=>tumbaPorId[t.id]=t);
    (tumbasIncoming[chave]||[]).forEach(t=>{
      const atual=tumbaPorId[t.id];
      if(!atual || new Date(t.updatedAt) > new Date(atual.updatedAt)) tumbaPorId[t.id]=t;
    });
    alvo._tombstones[chave]=Object.values(tumbaPorId);

    // 2) mescla os registros normais, mas exclusão vence se for mais recente que a versão recebida
    const local=alvo[chave]||[]; const vindos=incoming[chave]||[];
    const porId={}; local.forEach(r=>{ if(!tumbaPorId[r.id]) porId[r.id]=r; });
    vindos.forEach(r=>{
      const tumba=tumbaPorId[r.id];
      if(tumba && new Date(tumba.updatedAt) >= new Date(r.updatedAt||0)) return;
      const atual=porId[r.id];
      if(!atual || new Date(r.updatedAt||0) > new Date(atual.updatedAt||0)) porId[r.id]=r;
    });
    alvo[chave]=Object.values(porId);
  });
  // o PIN nunca viaja pelo backup nem pelo Firestore — cada aparelho mantém o seu próprio
}
function mesclarEstado(incoming){ mesclarEstadoEm(state,incoming); }

let fbUnsub={pessoal:null, pj:null};
let fbSaveTimeout={pessoal:null, pj:null};
let fbAplicandoRemoto={pessoal:false, pj:false};

function docIdDoPerfil(uid,perfil){ return perfil==='pj' ? uid+'_pj' : uid; }
function salvarPerfilLocal(perfil){
  try{ localStorage.setItem(storageKey(perfil), JSON.stringify(estados[perfil])); }catch(e){}
}

// Os dois perfis (Pessoal e PJ) sincronizam em paralelo o tempo todo, estejam ativos na tela
// ou não — assim trocar de perfil é instantâneo (o dado já está em memória), sem esperar rede.
async function iniciarSincronizacaoPerfil(uid,perfil){
  const ref=window.fbDoc(window.fbDb,'users',docIdDoPerfil(uid,perfil));
  try{
    const snap=await window.fbGetDoc(ref);
    if(snap.exists()){
      const eraNovo = perfil==='pessoal' ? estadoEraNovo : !estados.pj;
      if(eraNovo){
        // aparelho novo pra esse perfil (nunca teve dado local) + já existe dado na nuvem: usa a
        // nuvem direto, em vez de mesclar — evita duplicar defaults criados localmente à toa
        estados[perfil]=normalizarEstado(snap.data());
      }else{
        mesclarEstadoEm(estados[perfil],snap.data());
      }
      if(perfil===perfilAtivo){
        state=estados[perfil];
        gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
        aplicarTema();
      }
      salvarPerfilLocal(perfil);
    }
  }catch(e){ /* offline no primeiro acesso — segue só com o que já está local */ }

  if(fbUnsub[perfil]) fbUnsub[perfil]();
  fbUnsub[perfil]=window.fbOnSnapshot(ref, snap=>{
    if(!snap.exists()) return;
    fbAplicandoRemoto[perfil]=true;
    if(!estados[perfil]) estados[perfil]=estadoVazio(); // perfil PJ criado em outro aparelho chegando aqui pela 1ª vez
    mesclarEstadoEm(estados[perfil],snap.data());
    if(perfil===perfilAtivo){
      state=estados[perfil];
      gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
      aplicarTema();
      renderTudo();
    }
    salvarPerfilLocal(perfil);
    renderSeletorPerfil();
    fbAplicandoRemoto[perfil]=false;
  });
}

async function iniciarSincronizacao(user){
  window.fbUid=user.uid;
  await Promise.all(['pessoal','pj'].map(perfil=>iniciarSincronizacaoPerfil(user.uid,perfil)));
  estadoEraNovo=false;
}

function sincronizarComFirestore(){
  const perfil=perfilAtivo;
  if(!window.fbUid || fbAplicandoRemoto[perfil]) return;
  clearTimeout(fbSaveTimeout[perfil]);
  fbSaveTimeout[perfil]=setTimeout(()=>{
    const ref=window.fbDoc(window.fbDb,'users',docIdDoPerfil(window.fbUid,perfil));
    const paraEnviar={...state, config:{...state.config, pinHash:null}};
    window.fbSetDoc(ref, paraEnviar).catch(()=>{ /* sem internet: fica só local, sincroniza quando voltar */ });
  },1500);
}

function fbLogout(){
  ['pessoal','pj'].forEach(p=>{ if(fbUnsub[p]){ fbUnsub[p](); fbUnsub[p]=null; } });
  window.fbUid=null;
  window.fbSignOutFn(window.fbAuth);
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update());
  // quando uma versão nova assume o controle (skipWaiting+clients.claim no sw.js),
  // recarrega sozinho uma vez — sem isso o usuário fica preso na versão antiga em cache
  let jaRecarregou=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(jaRecarregou) return;
    jaRecarregou=true;
    location.reload();
  });
}
