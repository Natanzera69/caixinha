/* ---- Restaurar backup: valida, mostra o resumo e JUNTA com o que já existe (nunca apaga) ---- */
const CHAVES_PERFIL=['version','contas','cartoes','categorias','transacoes','financiamentos','investimentos','recorrencias','config','_tombstones','empresaNome'];
const BACKUP_MAX_BYTES=8*1024*1024;
// Aceita só objeto com listas de registros que tenham id; descarta chaves desconhecidas (mesma lista das regras do Firestore).
function sanearPerfilBackup(p){
  if(!p || typeof p!=='object' || Array.isArray(p)) throw new Error('Arquivo de backup inválido.');
  const out={version:1,config:{pinHash:null},_tombstones:{}};
  for(const k of CHAVES_SINCRONIZAVEIS){
    const arr=p[k]===undefined? [] : p[k];
    if(!Array.isArray(arr) || arr.length>50000) throw new Error('Backup com formato inesperado ('+k+').');
    out[k]=arr.filter(r=>r && typeof r==='object' && typeof r.id==='string' && r.id.length>0 && r.id.length<=80);
  }
  if(p.config && typeof p.config==='object'){ out.config={...p.config,pinHash:null}; } // PIN nunca vem de arquivo
  if(p._tombstones && typeof p._tombstones==='object'){
    for(const k of CHAVES_SINCRONIZAVEIS){
      const t=p._tombstones[k]; if(Array.isArray(t)) out._tombstones[k]=t.filter(x=>x&&typeof x.id==='string'&&typeof x.updatedAt==='string');
    }
  }
  if(typeof p.empresaNome==='string') out.empresaNome=p.empresaNome.slice(0,120);
  return out;
}
function lerObjetoBackup(obj){
  if(obj && obj.formatoBackup===2 && obj.pessoal) return {pessoal:sanearPerfilBackup(obj.pessoal), pj:obj.pj? sanearPerfilBackup(obj.pj) : null};
  if(obj && Array.isArray(obj.contas) && Array.isArray(obj.transacoes)) return {pessoal:sanearPerfilBackup(obj), pj:null}; // backup antigo (um perfil só)
  throw new Error('Esse arquivo não parece um backup do Caixinha.');
}
// Quantos registros do backup ainda não existem no estado atual (e quantos foram apagados depois do backup).
function resumoBackup(alvo,bk){
  const r={novos:0,apagados:0,total:0};
  if(!bk) return r;
  const tomb=(alvo&&alvo._tombstones)||{};
  CHAVES_SINCRONIZAVEIS.forEach(k=>{
    const ids=new Set(((alvo&&alvo[k])||[]).map(x=>x.id)); const apag=new Set((tomb[k]||[]).map(x=>x.id));
    bk[k].forEach(x=>{ r.total++; if(apag.has(x.id)) r.apagados++; else if(!ids.has(x.id)) r.novos++; });
  });
  return r;
}
function aplicarBackupNoPerfil(alvo,bk,recuperarApagados){
  if(recuperarApagados){ // traz de volta o que foi apagado depois do backup: remove o marcador e carimba o registro como "novo"
    CHAVES_SINCRONIZAVEIS.forEach(k=>{
      const ids=new Set(bk[k].map(x=>x.id)); const lista=(alvo._tombstones&&alvo._tombstones[k])||[];
      if(!lista.length) return;
      alvo._tombstones[k]=lista.filter(t=>!ids.has(t.id));
      bk[k].forEach(x=>{ if(lista.some(t=>t.id===x.id)) x.updatedAt=nowISO(); });
    });
  }
  mesclarEstadoEm(alvo,bk);
}
function lerArquivoBackup(arq){
  if(!arq) return;
  if(arq.size>BACKUP_MAX_BYTES){ alert('Arquivo grande demais para ser um backup do Caixinha.'); return; }
  const rd=new FileReader();
  rd.onerror=()=>alert('Não consegui ler o arquivo.');
  rd.onload=()=>{
    let bk; try{ bk=lerObjetoBackup(JSON.parse(rd.result)); }catch(e){ alert(e.message&&!/JSON/.test(e.message)?e.message:'Esse arquivo não é um backup válido.'); return; }
    abrirResumoBackup(bk);
  };
  rd.readAsText(arq);
}
function abrirResumoBackup(bk){
  const a=resumoBackup(estados.pessoal,bk.pessoal), b=bk.pj? resumoBackup(estados.pj,bk.pj) : null;
  const linha=(nome,r)=>`<p class="hint"><b>${nome}:</b> ${r.total} registros no arquivo — ${r.novos} que ainda não estão aqui${r.apagados?`, ${r.apagados} apagados depois do backup`:''}.</p>`;
  document.getElementById('modalCard').innerHTML=`
    <button class="close-x" onclick="fecharModal()"><span class="px-ico sm" style="--i:url(assets/icons/close.svg)"></span></button>
    <h2>Restaurar backup</h2>
    <p class="hint">O backup é <b>juntado</b> ao que você já tem: nada é apagado e, em caso de conflito, vale a versão mais recente.</p>
    ${linha('Perfil pessoal',a)}${b?linha('Perfil empresarial',b):''}
    <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:.88rem"><input type="checkbox" id="bkRecuperar" style="margin-top:3px"> Recuperar também o que eu apaguei depois deste backup</label>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarRestauracao()">Restaurar</button>
    </div>`;
  window.__bkPendente=bk; abrirModal();
}
function confirmarRestauracao(){
  const bk=window.__bkPendente; if(!bk) return; window.__bkPendente=null;
  const rec=!!document.getElementById('bkRecuperar')?.checked;
  aplicarBackupNoPerfil(estados.pessoal,bk.pessoal,rec);
  if(bk.pj){
    if(estados.pj) aplicarBackupNoPerfil(estados.pj,bk.pj,rec);
    else { estados.pj=normalizarEstado(bk.pj); estados.pj.config.onboardingConcluido=true; }
  }
  normalizarEstado(estados.pessoal); if(estados.pj) normalizarEstado(estados.pj);
  state=estados[perfilAtivo];
  salvarPerfilLocal('pessoal'); if(estados.pj) salvarPerfilLocal('pj');
  gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
  salvarEstado(); // sincroniza o perfil ativo
  if(window.fbUid && estados.pj){ // o outro perfil também sobe pra nuvem
    const outro=perfilAtivo==='pj'?'pessoal':'pj';
    try{ window.fbSetDoc(window.fbDoc(window.fbDb,'users',docIdDoPerfil(window.fbUid,outro)),JSON.parse(JSON.stringify({...estados[outro],config:{...estados[outro].config,pinHash:null}}))).catch(()=>{}); }catch(e){}
  }
  fecharModal(); renderTudo(); toast('Backup restaurado.');
}
function mesclarEstadoEm(alvo,incoming){
  if(!alvo._tombstones) alvo._tombstones={};
  const tumbasIncoming=incoming._tombstones||{};

  CHAVES_SINCRONIZAVEIS.forEach(chave=>{
    // 1) mescla os tombstones (mantém o mais recente por id)
    const tumbaPorId={};
    (alvo._tombstones[chave]||[]).forEach(t=>tumbaPorId[t.id]=t);
    (tumbasIncoming[chave]||[]).forEach(t=>{
      const atual=tumbaPorId[t.id];
      if(!atual || new Date(t.updatedAt) > new Date(atual.updatedAt)) tumbaPorId[t.id]=t;
    });
    alvo._tombstones[chave]=Object.values(tumbaPorId);

    // 2) mescla os registros normais, mas exclusão vence se for mais recente que a versão recebida
    const local=alvo[chave]||[]; const vindos=incoming[chave]||[];
    const porId={}; local.forEach(r=>{ if(!tumbaPorId[r.id]) porId[r.id]=r; });
    vindos.forEach(r=>{
      const tumba=tumbaPorId[r.id];
      if(tumba && new Date(tumba.updatedAt) >= new Date(r.updatedAt||0)) return;
      const atual=porId[r.id];
      if(!atual || new Date(r.updatedAt||0) > new Date(atual.updatedAt||0)) porId[r.id]=r;
    });
    if(chave==='recorrencias'){
      // mesesGerados é uma lista que cresce: une as duas versões em vez de deixar a mais nova apagar meses da outra
      const antes={}; local.forEach(r=>antes[r.id]=r.mesesGerados||[]);
      vindos.forEach(r=>{ antes[r.id]=[...new Set([...(antes[r.id]||[]),...(r.mesesGerados||[])])]; });
      Object.values(porId).forEach(r=>{ if(antes[r.id]) r.mesesGerados=antes[r.id]; });
    }
    alvo[chave]=Object.values(porId);
  });
  // config: PIN fica por aparelho; o resto converge (onboarding vale se concluído em qualquer aparelho; tema vence o mais recente)
  const cfgIn=incoming.config||{}; if(!alvo.config) alvo.config={pinHash:null};
  if(cfgIn.onboardingConcluido) alvo.config.onboardingConcluido=true;
  if(!alvo.empresaNome && incoming.empresaNome) alvo.empresaNome=incoming.empresaNome;
  if(cfgIn.temaAtualizadoEm && (!alvo.config.temaAtualizadoEm || cfgIn.temaAtualizadoEm>alvo.config.temaAtualizadoEm)){
    alvo.config.temaEscuro=!!cfgIn.temaEscuro; alvo.config.temaAtualizadoEm=cfgIn.temaAtualizadoEm;
  }
  // o PIN nunca viaja pelo backup nem pelo Firestore — cada aparelho mantém o seu próprio
}

/* ================= Modal genérico ================= */
let focoAntesDoModal=null;
let modalNoHistorico=false, voltandoDoModal=false;
function abrirModal(){
  focoAntesDoModal=document.activeElement;
  document.getElementById('modalRoot').classList.remove('hidden');
  document.getElementById('modalCard').focus({preventScroll:true}); // foco no diálogo (sem abrir o teclado do celular)
  // uma entrada no histórico por janela: o botão Voltar do celular fecha a janela em vez de sair do app
  if(!modalNoHistorico && !voltandoDoModal){ try{ history.pushState({cx:'modal'},''); modalNoHistorico=true; }catch(e){} }
}
window.addEventListener('popstate',()=>{
  if(voltandoDoModal){ voltandoDoModal=false; return; } // eco do history.back() que nós mesmos pedimos
  if(modalNoHistorico && !document.getElementById('modalRoot').classList.contains('hidden')) fecharModal(true);
});
function fecharModal(deVoltar){
  if(modalNoHistorico){
    modalNoHistorico=false;
    if(deVoltar!==true && history.state && history.state.cx==='modal'){ voltandoDoModal=true; try{ history.back(); }catch(e){ voltandoDoModal=false; } }
  }
  document.getElementById('modalRoot').classList.add('hidden'); document.getElementById('modalCard').innerHTML='';
  if(focoAntesDoModal && document.contains(focoAntesDoModal)) focoAntesDoModal.focus({preventScroll:true});
  focoAntesDoModal=null;
  if(window.recarregarAoFechar) location.reload(); // atualização do app que chegou com o modal aberto
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('modalRoot').classList.contains('hidden')) return;
  if(e.key==='Escape'){ fecharModal(); return; }
  if(e.key==='Tab'){ // foco preso no diálogo: Tab no último volta ao primeiro (e Shift+Tab ao contrário)
    const f=[...document.getElementById('modalCard').querySelectorAll('button,a[href],input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length) return;
    const primeiro=f[0], ultimo=f[f.length-1], atual=document.activeElement;
    if(e.shiftKey && (atual===primeiro||atual===document.getElementById('modalCard'))){ e.preventDefault(); ultimo.focus(); }
    else if(!e.shiftKey && atual===ultimo){ e.preventDefault(); primeiro.focus(); }
  }
});
// botões só com ícone têm title; espelha em aria-label pra leitores de tela (cobre tudo que o JS renderiza)
const CAMPO_TEXTO='input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]),select,textarea';
document.addEventListener('focusin',e=>{ if(matchMedia('(max-width:680px) and (pointer:coarse)').matches && e.target.matches && e.target.matches(CAMPO_TEXTO)) document.body.classList.add('digitando'); });
document.addEventListener('focusout',()=>setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.matches&&a.matches(CAMPO_TEXTO))) document.body.classList.remove('digitando'); },120));
new MutationObserver(()=>{
  document.querySelectorAll('button[title]:not([aria-label])').forEach(b=>b.setAttribute('aria-label',b.title));
  document.querySelectorAll('input[type=number][step="0.01"]:not([inputmode])').forEach(i=>i.setAttribute('inputmode','decimal')); // teclado de valores
  document.querySelectorAll('#modalCard input[type=text]:not([autocomplete]),#modalCard input:not([type]):not([autocomplete]),#modalCard textarea:not([autocomplete])').forEach(i=>i.setAttribute('autocomplete','off'));
  // campo dentro de .field com <label> irmão: usa o texto do label como nome acessível
  document.querySelectorAll('.field').forEach(f=>{
    const l=f.querySelector('label'), c=f.querySelector('input:not([type=hidden]),select,textarea');
    if(l && c && !c.hasAttribute('aria-label') && !(c.labels&&c.labels.length)) c.setAttribute('aria-label',l.textContent.trim());
  });
}).observe(document.body,{childList:true,subtree:true});

const EMOJI_RECENTES='planilhaFinanceiro_emojisRecentes';
let emojiCb=null, emojiPromessa=null, emojiCanvas=null;
function carregarEmojis(){
  if(window.EMOJIS) return Promise.resolve();
  if(!emojiPromessa) emojiPromessa=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='assets/emojis-pt.js'; s.onload=res; s.onerror=()=>{ emojiPromessa=null; rej(); };
    document.head.appendChild(s);
  });
  return emojiPromessa;

function emojiRecentes(){ try{ return JSON.parse(lsGet(EMOJI_RECENTES)||'[]'); }catch(e){ return []; } }
function emojiLembrar(e){ lsSet(EMOJI_RECENTES,JSON.stringify([e,...emojiRecentes().filter(x=>x!==e)].slice(0,24))); }
function semAcento(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// Sequência com ZWJ que o aparelho não monta vira vários símbolos lado a lado (largura bem maior que 1 emoji): esconde.
function emojiDesenha(e){
  if(!e.includes('\u200D')) return true;
  try{
    if(!emojiCanvas){ const ctx=document.createElement('canvas').getContext('2d'); ctx.font='32px sans-serif'; emojiCanvas={ctx,base:ctx.measureText('😀').width}; }
    return emojiCanvas.ctx.measureText(e).width < emojiCanvas.base*1.5;
  }catch(err){ return true; }
}
function emojiBotoes(lista){
  const itens=lista.filter(x=>emojiDesenha(x[0]));
  return itens.length? itens.map(x=>`<button type="button" class="emoji-btn" data-e="${escapeHtml(x[0])}" aria-label="${escapeHtml(x[1])}" title="${escapeHtml(x[1])}">${escapeHtml(x[0])}</button>`).join('')
                     : '<div class="emoji-vazio">Nenhum ícone encontrado.</div>';
}
function escolherEmoji(e){ emojiLembrar(e); fecharModal(); if(emojiCb) emojiCb(e); }
async function abrirSeletorIcone(aoEscolher){
  emojiCb=aoEscolher;
  document.getElementById('modalCard').innerHTML=`
    <button class="close-x" onclick="fecharModal()">${'<span class="px-ico sm" style="--i:url(assets/icons/close.svg)"></span>'}</button>

  try{ await carregarEmojis(); }
  catch(e){ grade.innerHTML='<div class="emoji-vazio">Não consegui carregar a lista de ícones. Confira a internet e tente de novo.</div>'; return; }
  const grupos=window.EMOJIS.grupos, abas=document.getElementById('emojiAbas'), busca=document.getElementById('emojiBusca');
  const recentes=emojiRecentes().map(e=>[e,'recente','']);
  const tabs=[...(recentes.length?[{id:'recentes',nome:'Recentes',ico:'🕘',e:recentes}]:[]),...grupos];

  };
  abas.addEventListener('click',ev=>{ const b=ev.target.closest('.emoji-aba'); if(b){ busca.value=''; mostrar(b.dataset.g); } });
  grade.addEventListener('click',ev=>{ const b=ev.target.closest('.emoji-btn'); if(b) escolherEmoji(b.dataset.e); });
  busca.addEventListener('input',()=>{
    const q=semAcento(busca.value.trim());
    if(!q){ mostrar(tabs[0].id); return; }
    abas.querySelectorAll('.emoji-aba').forEach(b=>b.classList.remove('active'));
    const achados=[];
    grupos.slice(1).forEach(g=>g.e.forEach(x=>{ // grupo 0 (Finanças) repete emojis dos outros
      const k=x[2], palavras=k.split(' ');
      const nome=semAcento(x[1]); // exato > palavra inteira > começa com > palavra começa com > contém
      const nota=nome===q?0 : palavras.includes(q)?1 : nome.startsWith(q)?2 : palavras.some(p=>p.startsWith(q))?3 : k.includes(q)?4 : -1;
      if(nota>=0) achados.push([nota,x]);
    }));
    achados.sort((a,b)=>a[0]-b[0]);
    grade.innerHTML=emojiBotoes(achados.slice(0,150).map(a=>a[1])); grade.scrollTop=0;
  });
  mostrar(tabs[0].id);
  if(!matchMedia('(pointer:coarse)').matches) busca.focus(); // no celular não abre o teclado sozinho
}

let fbUnsub={pessoal:null, pj:null};
let fbSaveTimeout={pessoal:null, pj:null};
let fbAplicandoRemoto={pessoal:false, pj:false};

function docIdDoPerfil(uid,perfil){ return perfil==='pj' ? uid+'_pj' : uid; }
function salvarPerfilLocal(perfil){
  try{ localStorage.setItem(storageKey(perfil), JSON.stringify(estados[perfil])); }catch(e){}
}

// Os dois perfis (Pessoal e PJ) sincronizam em paralelo o tempo todo, estejam ativos na tela
// ou não — assim trocar de perfil é instantâneo (o dado já está em memória), sem esperar rede.
async function iniciarSincronizacaoPerfil(uid,perfil){
  const ref=window.fbDoc(window.fbDb,'users',docIdDoPerfil(uid,perfil));
  try{
    const snap=await window.fbGetDoc(ref);
    if(snap.exists()){
      const eraNovo = perfil==='pessoal' ? estadoEraNovo : !estados.pj;
      if(eraNovo){
        // aparelho novo pra esse perfil (nunca teve dado local) + já existe dado na nuvem: usa a
        // nuvem direto, em vez de mesclar — evita duplicar defaults criados localmente à toa
        estados[perfil]=normalizarEstado(snap.data());
      }else{
        mesclarEstadoEm(estados[perfil],snap.data());
      }
      if(perfil===perfilAtivo){
        state=estados[perfil];
        gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
        aplicarTema();
      }
      salvarPerfilLocal(perfil);
    }
  }catch(e){ /* offline no primeiro acesso — segue só com o que já está local */ }

  if(fbUnsub[perfil]) fbUnsub[perfil]();
  fbUnsub[perfil]=window.fbOnSnapshot(ref, snap=>{
    if(!snap.exists()) return;
    fbAplicandoRemoto[perfil]=true;
    if(!estados[perfil]) estados[perfil]=estadoVazio(); // perfil PJ criado em outro aparelho chegando aqui pela 1ª vez
    mesclarEstadoEm(estados[perfil],snap.data());
    if(perfil===perfilAtivo){
      state=estados[perfil];
      gerarTransacoesRecorrentesDoMes(new Date().getFullYear(), new Date().getMonth());
      aplicarTema();
      renderTudo();
    }
    salvarPerfilLocal(perfil);
    renderSeletorPerfil();
    fbAplicandoRemoto[perfil]=false;
  });
}

async function iniciarSincronizacao(user){
  window.fbUid=user.uid;
  await Promise.all(['pessoal','pj'].map(perfil=>iniciarSincronizacaoPerfil(user.uid,perfil)));
  estadoEraNovo=false;
}

function sincronizarComFirestore(){
  const perfil=perfilAtivo;
  if(!window.fbUid || fbAplicandoRemoto[perfil]) return;
  clearTimeout(fbSaveTimeout[perfil]);
  fbSaveTimeout[perfil]=setTimeout(()=>{
    const ref=window.fbDoc(window.fbDb,'users',docIdDoPerfil(window.fbUid,perfil));
    const paraEnviar=JSON.parse(JSON.stringify({...state, config:{...state.config, pinHash:null}})); // JSON limpa `undefined` (Firestore rejeita)
    window.fbSetDoc(ref, paraEnviar).catch(()=>{ /* sem internet: fica só local, sincroniza quando voltar */ });
  },1500);
}

function fbLogout(){
  ['pessoal','pj'].forEach(p=>{ if(fbUnsub[p]){ fbUnsub[p](); fbUnsub[p]=null; } clearTimeout(fbSaveTimeout[p]); });

}

      <h3 style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:16px 0 8px">Liberados (${convites.length})</h3>
      <div class="list">${convites.length? convites.map(e=>`<div class="row-card"><div class="row-main"><div class="t1">${escapeHtml(e)}</div></div>

async function liberarEmail(email,pedidoUid){

  try{
    await window.fbSetDoc(window.fbDoc(window.fbDb,'convites',e),{por:ADMIN_UID,em:nowISO()});
    if(pedidoUid) await window.fbDeleteDoc(window.fbDoc(window.fbDb,'pedidos',pedidoUid));
    toast('Liberado: '+e); carregarPainelConvites();
  }catch(err){ alert('Não consegui liberar (as regras do Firestore já foram publicadas?).'); }
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update());
  // quando uma versão nova assume o controle (skipWaiting+clients.claim no sw.js),
  // recarrega sozinho uma vez — sem isso o usuário fica preso na versão antiga em cache
  let jaRecarregou=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(jaRecarregou) return;
    jaRecarregou=true;
    if(!document.getElementById('modalRoot').classList.contains('hidden')){ window.recarregarAoFechar=true; return; } // não perde o que está sendo digitado
    location.reload();
  });
